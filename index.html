<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaserToolFX</title>
<meta name="description" id="metaDesc" content="Générateur gratuit de boîtes, coffres et formes pour découpe laser : SVG prêts à découper.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LaserToolFX">
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="motifs.js"></script>
<script src="textures.js"></script>
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<style>
:root{
  --bg:#eceef2;--panel:#ffffff;--panel2:#f6f7f9;--ink:#14161a;--muted:#6b7280;--line:#e2e5ea;
  --accent:#f97316;--accent2:#ea580c;--accent-ink:#ffffff;--accent-soft:rgba(249,115,22,.12);
  --field:#f4f5f7;--stage:#e4e7ec;--grid:rgba(20,22,26,.055);
  --warn-bg:#fff4e5;--warn:#9a3412;--ok:#15803d;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.10);
  --wood:#f1dfbd;--wood-dark:#b98b5c;
  --glow2:#22d3ee;--panel-rgb:255,255,255;--glass-border:rgba(20,22,26,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1014;--panel:#15181e;--panel2:#1b1f27;--ink:#e9ebef;--muted:#9aa1ad;--line:#262b34;
  --accent:#fb923c;--accent2:#f97316;--accent-ink:#1a0f05;--accent-soft:rgba(251,146,60,.14);
  --field:#0f1116;--stage:#0a0c10;--grid:rgba(255,255,255,.045);
  --warn-bg:#2a1a0c;--warn:#fdba74;--ok:#4ade80;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  --glow2:#38bdf8;--panel-rgb:21,24,30;--glass-border:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{
  --bg:#0e1014;--panel:#15181e;--panel2:#1b1f27;--ink:#e9ebef;--muted:#9aa1ad;--line:#262b34;
  --accent:#fb923c;--accent2:#f97316;--accent-ink:#1a0f05;--accent-soft:rgba(251,146,60,.14);
  --field:#0f1116;--stage:#0a0c10;--grid:rgba(255,255,255,.045);
  --warn-bg:#2a1a0c;--warn:#fdba74;--ok:#4ade80;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  --glow2:#38bdf8;--panel-rgb:21,24,30;--glass-border:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:58px minmax(0,1fr) 32px;height:100vh;overflow:hidden;
  background:
    radial-gradient(900px 480px at 12% -8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(700px 420px at 108% 6%, color-mix(in srgb, var(--glow2) 12%, transparent), transparent 60%),
    var(--bg)}
button{font:inherit;color:inherit}
.ic{flex:none;display:block}

/* ---- Barre d'application ---- */
.appbar{display:flex;align-items:center;gap:14px;padding:0 14px;min-width:0;
  background:color-mix(in srgb, var(--panel) 70%, transparent);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid var(--glass-border);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:32px;height:32px;filter:drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 60%, transparent))}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand b .fx{font-style:normal;color:var(--accent)}
.brand span{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.brand span em{font-style:normal;color:var(--accent);font-weight:700}
.projfield{flex:0 1 300px;min-width:140px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 10px 5px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:text;transition:border-color .15s,box-shadow .15s;margin-left:6px}
.projfield:hover{border-color:var(--accent)}
.projfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.projlbl{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.1}
.projrow{display:flex;align-items:center;gap:6px}
.projname{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:0;outline:none}
.projname::placeholder{color:var(--muted);font-weight:500}
.projfield .pen{color:var(--muted);flex:none}
.projfield:hover .pen,.projfield:focus-within .pen{color:var(--accent)}
.actions{margin-left:auto;display:flex;align-items:center;gap:4px;position:relative}
.tb{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .15s ease,transform .12s ease,box-shadow .2s ease}
.tb:hover{background:var(--panel2)}
.tb.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--accent-ink);padding:8px 14px;margin-left:6px;
  box-shadow:0 1px 1px rgba(0,0,0,.1),0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent),0 8px 22px -8px color-mix(in srgb, var(--accent) 70%, transparent)}
.tb.primary:hover{background:linear-gradient(180deg,var(--accent2),var(--accent2));transform:translateY(-1px);
  box-shadow:0 2px 3px rgba(0,0,0,.12),0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent),0 12px 28px -6px color-mix(in srgb, var(--accent) 80%, transparent)}
.tb.primary:active{transform:translateY(0)}
.tb.dark{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0)) var(--panel2);color:var(--ink);padding:8px 14px;
  border:1px solid var(--glass-border);
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 20px -14px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.03) inset}
.tb.dark:hover{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0)) var(--field);transform:translateY(-1px);
  box-shadow:0 2px 3px rgba(0,0,0,.1),0 14px 26px -12px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.05) inset}
.tb.dark:active{transform:translateY(0)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.menu{position:absolute;right:40px;top:46px;background:color-mix(in srgb, var(--panel) 92%, transparent);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.03) inset;padding:6px;min-width:250px;z-index:30}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--panel2)}
.menu small{display:block;color:var(--muted);font-size:12px;font-weight:400}

/* ---- Espace de travail ---- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 316px;min-height:0}
.panel{background:var(--panel);overflow:auto;min-height:0;scrollbar-width:thin}
.panel.left{border-right:1px solid var(--line)}
.panel.right{border-left:1px solid var(--line)}
.panel-head{padding:14px 14px 6px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.models{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 14px 12px}
.model{flex-direction:row !important;justify-content:flex-start;padding:10px 12px !important;text-align:left !important}
.model{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;cursor:pointer;font-weight:600;font-size:12.5px;text-align:center;transition:border-color .15s,background .15s,box-shadow .2s}
.model:hover{border-color:var(--accent)}
.model[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent),0 0 20px -5px color-mix(in srgb, var(--accent) 60%, transparent)}
.model-desc{margin:-4px 14px 10px;font-size:12px;color:var(--muted)}
details.grp{border-top:1px solid var(--line)}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;user-select:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s;margin-right:3px}
details.grp:not([open])>summary::after{transform:rotate(-45deg)}
details.grp>summary:hover{color:var(--ink)}
.grp-body{padding:0 14px 12px}
.row{display:grid;grid-template-columns:1fr 116px;align-items:center;gap:10px;margin:7px 0}
.row label{font-size:13.5px}
.row .u{position:relative}
.row input[type=number],.row input[type=text],.row select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit;font-size:13.5px}
.row input:focus,.row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 16px -6px color-mix(in srgb, var(--accent) 55%, transparent)}
.row input[type=text]{grid-column:span 1}
.row .u span{position:absolute;right:26px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.sw{justify-self:end;position:relative;width:38px;height:22px;display:inline-block;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:background .15s}
.sw i::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::before{transform:translateX(16px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 2px}
.hint a{color:var(--accent)}
.fontbtns{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:9px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.wide{width:calc(100% - 28px);margin:10px 14px 16px}
.notice ul{margin:0;padding-left:18px;font-size:13px}
.notice li{margin:5px 0}

/* ---- Plan de travail ---- */
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:var(--stage)}
.stagebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.sheettabs{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.zoom{margin-left:auto;display:flex;align-items:center;gap:2px}
.zoom .tb{padding:6px 8px}
.zoom output{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.viewport{position:relative;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.viewport.panning{cursor:grabbing}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-wrap:wrap;gap:48px;align-content:flex-start}
.sheet .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;font-weight:600;margin:0 2px 8px}
.sheet .lbl b{color:var(--ink)}
.sheet .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.sheet>svg{width:100%;height:auto;display:block;border-radius:4px;box-shadow:var(--shadow);background:var(--wood)}
.sheet.decor>svg{background:var(--wood-dark)}
.sheet svg path,.sheet svg circle,.sheet svg rect{vector-effect:non-scaling-stroke}
.sheet svg .cut{stroke-width:1.2px}
.sheet.decor svg .cut{stroke:#ffd1c2}
.sheet svg .engrave-line{stroke-width:1.2px}
.sheet svg [data-ti]{cursor:move}
.plan{cursor:crosshair;touch-action:none;user-select:none}
.plan .p-wall{fill:var(--wood);stroke:#c9a877;stroke-width:1px}
.plan .p-in{fill:#e9d3a9}
.plan .p-grid{stroke:rgba(90,60,20,.25);stroke-width:1px;stroke-dasharray:4 3}
.plan .p-reg{fill:#f5cfa4;stroke:var(--accent);stroke-width:1.4px}
.plan [data-reg]:hover .p-reg{fill:#f3bd85}
.plan text{text-anchor:middle;font-family:Inter,system-ui,sans-serif;pointer-events:none}
.plan .p-name{fill:#3b2a14;font-weight:700}
.plan .p-dim{fill:#7a6040}
.plan .p-split{cursor:pointer}
.plan .p-split circle{fill:var(--panel);stroke:var(--accent);stroke-width:1px}
.plan .p-split text{fill:var(--accent)}
.plan .p-split:hover circle{fill:var(--accent)}.plan .p-split:hover text{fill:var(--accent-ink)}
.plan .p-sel{fill:rgba(249,115,22,.25);stroke:var(--accent);stroke-width:2px;stroke-dasharray:5 3}
.renamer{position:fixed;transform:translate(-50%,-50%);z-index:70;padding:8px 10px;border:2px solid var(--accent);border-radius:9px;background:var(--panel);color:var(--ink);font:600 14px Inter,system-ui,sans-serif;box-shadow:var(--shadow);width:180px}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.sheet svg [data-ti]:hover .grab{fill:rgba(249,115,22,.14);stroke:#f97316;stroke-dasharray:3 2;stroke-width:1px}
.warns{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.warn{pointer-events:auto;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:10px;padding:7px 12px;font-size:13px;box-shadow:var(--shadow);max-width:680px}
.warn.err{font-weight:600}

/* ---- Barre d'état ---- */
.status{display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status .ok{color:var(--ok);font-weight:600}.status .bad{color:var(--warn);font-weight:600}
.status .legend{display:flex;gap:12px;margin-left:auto}
.status .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.status a{color:var(--muted);text-decoration:none}.status a:hover{color:var(--accent)}

/* ---- Fenêtres ---- */
.modal{position:fixed;inset:0;background:rgba(8,10,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.card{background:color-mix(in srgb, var(--panel) 90%, transparent);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--glass-border);border-radius:16px;
  box-shadow:0 1px 1px rgba(0,0,0,.06),0 30px 70px -24px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.03) inset;width:min(560px,100%);max-height:86vh;overflow:auto;padding:20px}
.card h2{margin:0 0 4px;font-size:18px}
.card.wide{width:min(980px,100%)}
.gd{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.gd svg{width:100%;height:auto;display:block}
.gd .gw{fill:#ecd2a2;stroke:#b9955e;stroke-width:1.2}
.gd .gb{fill:#e3c48f;stroke:#b9955e;stroke-width:1.2}
.gd .gbt{fill:#dfc08a;stroke:#b9955e;stroke-width:1.2}
.gd .gac{fill:var(--accent)}
.gd .gdk{fill:#8a5d34;stroke:#5e3d1f}
.gd .gdkline{fill:none;stroke:#8a5d34;stroke-width:6}
.gd .gbx{fill:#f8e6c4;stroke:#c9a46a;stroke-width:1.2}
.gd .gslot{fill:#6e4a28}
.gd .gghost{fill:none;stroke:var(--muted);stroke-dasharray:3 4;opacity:.6}
.gd .gstrip{fill:none;stroke:#ecd2a2;stroke-width:9}
.gd .gmort{fill:none;stroke:#6e4a28;stroke-width:3.5;stroke-dasharray:7 20}
.gd .gpanel{fill:none;stroke:#ecd2a2;stroke-width:9}
.gd .ghinge{fill:none;stroke:#a07a45;stroke-width:9;stroke-dasharray:1.2 4}
.gd .ghg{stroke:#a07a45;stroke-width:1}
.gd .gar2{fill:none;stroke:var(--muted);stroke-width:1.6;color:var(--muted)}
.gd .gc{color:var(--muted)}.gd .gc polyline{fill:none;stroke:var(--muted);stroke-width:1.2}
.gd .gt{font-size:13px;fill:var(--ink);font-weight:600}
.gd .go{font-size:13px;fill:var(--accent);font-weight:700}
.gd .gm{font-size:11.5px;fill:var(--muted)}
.gd .gbk{font-size:11px;fill:#3b2a14;font-weight:600}
.gd-h{font-size:14px;margin:16px 0 6px}
.guidebtn span{font-size:13px}
@media (max-width:1180px){.guidebtn span{display:none}}

.card p{color:var(--muted);margin:4px 0 14px}
.card .close{float:right;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.pitem .meta{flex:1;min-width:0}
.pitem .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .meta small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mtable{width:100%;border-collapse:collapse}
.mtable th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.mtable td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.mtable tr:hover td{background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(20px);background:color-mix(in srgb, var(--ink) 92%, transparent);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:60;box-shadow:0 10px 40px -10px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1180px){.app{grid-template-columns:272px minmax(0,1fr) 284px}.tb.lbl span{display:none}}
@media (max-width:860px){
  body{height:auto;overflow-x:hidden;overflow-y:auto;grid-template-rows:auto auto auto;grid-template-columns:minmax(0,1fr)}
  .appbar{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .actions{flex-wrap:wrap;margin-left:0;width:100%;justify-content:space-between}
  .tb{padding:8px}.tb.primary{margin-left:0}
  .menu{right:0;left:auto}
  .projfield{order:3;flex:1 1 100%;margin-left:0}
  .tb span{display:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .panel{min-width:0}
  .stage{order:-1;height:62vh}
  .panel{overflow:visible;border:0 !important;border-bottom:1px solid var(--line) !important}
  .status{flex-wrap:wrap;white-space:normal;padding:8px 12px}
  .status .legend{margin-left:0}
}

  "notice.orga.bins.assembly": {fr: "Montage : assemble le casier comme une boîte à encoches, puis les bacs ; ils se posent côte à côte et se sortent par le dessus.", en: "Assembly: assemble the tray like a finger-jointed box, then the bins; they sit side by side and lift out from the top."},
  "notice.orga.drawers.dims": {fr: "Tiroirs : {dw} mm de large, {dd} mm de profondeur, hauteur selon la rangée (jeu {j} mm de chaque côté).", en: "Drawers: {dw} mm wide, {dd} mm deep, height depending on the row (clearance {j} mm on each side)."},
  "notice.orga.drawers.single": {fr: "Un tiroir par hauteur de rangée : découpe chacun autant de fois qu'il y a de cases dans la rangée (étiquettes désactivées dans ce mode).", en: "One drawer per row height: cut each one as many times as there are cells in the row (labels disabled in this mode)."},

  "notice.orga.assembly": {fr: "Montage : 1) plante les séparateurs dans les étagères (et le fond / le dessus). 2) Emboîte les étagères dans le dos puis dans les côtés. 3) Ferme avec le fond et le dessus. 4) Assemble les tiroirs et glisse-les dans les cases.", en: "Assembly: 1) Fit the dividers into the shelves (and the bottom / top). 2) Fit the shelves into the back then the sides. 3) Close with the bottom and top. 4) Assemble the drawers and slide them into the cells."},
  "notice.orga.compartments": {fr: "Compartiments : les séparateurs s'emboîtent à mi-bois pour former la grille, puis se posent dans le tiroir ou le bac.", en: "Compartments: the dividers fit together half-lap to form the grid, then drop into the drawer or bin."},
  "notice.tray.layer": {fr: "Étage {n} : casier {W}×{D}×{H} mm, {count} boîtes de {bh} mm de haut.", en: "Layer {n}: tray {W}×{D}×{H} mm, {count} boxes {bh} mm tall."},
  "notice.tray.assembly": {fr: "Montage : assemble chaque casier comme une boîte ouverte, colle le cadre d'empilage centré sous le fond des étages supérieurs (et sous le couvercle), puis assemble les boîtes et range-les selon le plan.", en: "Assembly: assemble each tray like an open box, glue the stacking frame centered under the bottom of the upper layers (and under the lid), then assemble the boxes and arrange them according to the plan."},

  // Coffre : charnières en bois
  "field.charnieres": {fr: "Charnières en bois", en: "Wooden hinges"},
  "notice.chest.assemblyWood": {fr: "Montage : assemble le corps ; en haut à l'arrière, chaque côté a un arrondi creusé où apparaît l'ergot carré de la plaque arrière, à fleur. Enfile la languette ronde de chaque flanc du couvercle sur son ergot (par l'extérieur), puis plante les tenons du panneau flexible dans les mortaises des deux flancs en le cintrant, et colle-le : il tient les flancs en place. Les flancs débordent de {m} mm devant et derrière.", en: "Assembly: assemble the body; at the top back, each side has a carved round recess showing the back panel's square stud, flush. Slip each lid flank's round tab over its stud (from outside), then fit the flexible panel's tabs into the mortises of both flanks by bending it, and glue it: it holds the flanks in place. The flanks overhang {m} mm front and back."},
  "notice.chest.hinges": {fr: "Charnières en bois sans pièce rapportée : l'axe est l'ergot carré taillé au bout de la plaque arrière, le couvercle tourne autour par le trou rond de ses flancs ; couvercle et corps ont la même largeur. Pas de colle sur l'ergot. Ponce un peu ses arêtes si la rotation accroche. L'ergot est petit : ne soulève pas le coffre par le couvercle.", en: "Wooden hinges with no extra part: the pivot is the square stud cut at the end of the back panel, the lid turns around it through its flanks' round holes; lid and body are the same width. No glue on the stud. Lightly sand its edges if the rotation catches. The stud is small: don't lift the chest by its lid."},
  "field.feutrine": {fr: "Feutrine intérieure", en: "Felt lining"},
  "field.feltE": {fr: "Épaisseur de la feutrine", en: "Felt thickness"},
  "field.feltLid": {fr: "Feutrine aussi dans le couvercle", en: "Felt in the lid too"},

  "piece.feltFront": {fr: "Feutrine façade", en: "Felt front"},
  "piece.feltBack": {fr: "Feutrine dos", en: "Felt back"},
  "piece.feltSide": {fr: "Feutrine côté", en: "Felt side"},
  "piece.feltLid": {fr: "Feutrine couvercle (bande cintrée)", en: "Felt lid (curved strip)"},
  "piece.feltFlank": {fr: "Feutrine flanc", en: "Felt flank"},
  "sheet.feltTag": {fr: "Feutrine", en: "Felt"},
  "notice.chest.felt": {fr: "Feutrine ({e} mm) : colle d'abord le fond, puis la façade et le dos posés dessus, puis les côtés entre eux ; dans le couvercle, la bande cintrée puis les deux demi-lunes des flancs. Colle en spray ou double face, pas de colle liquide qui traverse. Au laser : feutrine polyester ou laine, jamais de feutrine PVC ou plastifiée.", en: "Felt ({e} mm): glue the bottom first, then the front and back on top of it, then the sides between them; in the lid, the curved strip then both flank half-moons. Spray glue or double-sided tape, no liquid glue that soaks through. On the laser: polyester or wool felt, never PVC or plastic-coated felt."},
  "notice.chest.backDecor": {fr: "Décor du dos : encoches aux coins du haut et bord haut abaissé de {top} mm, pour laisser passer le couvercle à l'ouverture. Colle-le bord bas affleurant le bas du coffre.", en: "Back decor: notches in the top corners and top edge lowered by {top} mm, so the lid clears it when opening. Glue it with its bottom edge flush with the bottom of the chest."},
  "warn.chest.hingeNoRoom": {fr: "Charnières en bois retirées : corps trop bas (30 mm minimum).", en: "Wooden hinges removed: body too low (30 mm minimum)."},

  "notice.lantern.roof": {fr: "Toit amovible : pose les 2 pignons debout sur le cadre, à {c} mm des bords gauche et droit, leurs ergots dans les angles de l'ouverture ; colle les 2 pans ({Lr}×{s} mm) sur leurs pentes, faîte contre faîte. Soulève le toit pour poser la bougie ; une ficelle dans les trous des pignons permet de suspendre la lanterne.", en: "Removable roof: stand the 2 gables on the frame, {c} mm from the left and right edges, their studs in the corners of the opening; glue the 2 panels ({Lr}×{s} mm) onto their slopes, ridge to ridge. Lift the roof to place the candle; a string through the gables' holes lets you hang the lantern."},

  "notice.lantern.order": {fr: "Lance la gravure (noir) avant la découpe (rouge) : le contour de la citrouille est gravé, son visage est découpé.", en: "Run the engraving (black) before the cutting (red): the pumpkin outline is engraved, its face is cut out."},
  "notice.lantern.assembly": {fr: "Montage : emboîte les 4 faces sur le fond, puis pose le cadre du dessus. Un filet de colle à bois dans les encoches suffit.", en: "Assembly: fit the 4 sides onto the bottom, then the top frame. A thin line of wood glue in the joints is enough."},

  "notice.hexa.dims": {fr: "Lanterne hexagonale : {flat} mm entre faces, {H} mm de haut (corps), 6 panneaux de {wp}×{H} mm, pleins : ajoute tes motifs avant la découpe.", en: "Hexagonal lantern: {flat} mm across flats, {H} mm tall (body), 6 panels {wp}×{H} mm, plain: add your motifs before cutting."},
  "notice.hexa.corners": {fr: "Angles : les panneaux se touchent par l'intérieur ; colle-les entre eux, il reste un petit V à l'extérieur de chaque angle (ponce ou laisse-le, c'est l'esprit lanterne).", en: "Corners: the panels touch on the inside; glue them together, a small V remains outside each corner (sand it or keep it)."},
  "notice.hexa.assembly": {fr: "Montage : plante les 6 panneaux dans la base et colle les angles. Plante le lanternon dans le plateau, pose le chapeau et l'anneau, puis colle cet ensemble. Le plateau se pose sur les panneaux sans colle : soulève-le pour la bougie LED.", en: "Assembly: plug the 6 panels into the base and glue the corners. Plug the cupola into the top plate, add the cap and the ring, then glue that group. The top plate sits on the panels without glue: lift it for the LED candle."},
  "field.calque": {fr: "Calque intérieur (papier rainuré à plier)", en: "Inner vellum (scored paper to fold)"},
  "piece.paperStrip": {fr: "Calque bande {n} faces", en: "Vellum strip {n} sides"},

  "sheet.paperTag": {fr: "Papier / calque", en: "Paper / vellum"},
  "notice.hexa.paper": {fr: "Calque intérieur : 2 bandes de 3 faces, lignes noires = plis. À la Cricut, importe le SVG, passe les lignes noires en « Rainurer », sélectionne tout puis « Attacher » : découpe et rainurage en une passe. Plie, colle chaque languette sous le début de l'autre bande et glisse l'anneau dans la lanterne avant de poser le plateau.", en: "Inner vellum: 2 strips of 3 sides, black lines = folds. On a Cricut, import the SVG, set the black lines to “Score”, select all then “Attach”: cut and score in one pass. Fold, glue each tab under the start of the other strip and slide the ring into the lantern before setting the top plate."},
  "notice.hexa.paperDoor": {fr: "Calque intérieur : une bande pliée pour les 5 panneaux fixes (lignes noires = plis) et un morceau à coller derrière la porte. À la Cricut, importe le SVG, passe les lignes noires en « Rainurer », sélectionne tout puis « Attacher » : découpe et rainurage en une passe. Colle la bande contre les panneaux fixes, sans la coller à la porte.", en: "Inner vellum: one folded strip for the 5 fixed panels (black lines = folds) and a piece to glue behind the door. On a Cricut, import the SVG, set the black lines to “Score”, select all then “Attach”: cut and score in one pass. Glue the strip against the fixed panels, not to the door."},
  "field.porte": {fr: "Porte (un panneau qui pivote)", en: "Door (one pivoting panel)"},
  "piece.hexDoor": {fr: "Porte", en: "Door"},
  "notice.hexa.door": {fr: "Porte : panneau de {wd} mm (0,8 mm de jeu à chaque bout) avec 2 tourillons carrés qui tournent dans les trous ronds de la base et du plateau, sans colle. Vue de dehors, charnière à droite et encoche pour le doigt à gauche (retourne la porte tête en bas si besoin, en gardant ta face décorée dehors). Pour qu'elle reste fermée : un petit aimant néodyme collé sur son bord libre et un autre sur le panneau voisin.", en: "Door: {wd} mm panel (0.8 mm clearance at each end) with 2 square pins turning in the round holes of the base and top plate, no glue. Seen from outside, hinge on the right and finger notch on the left (turn the door upside down if needed, decorated face out). To keep it closed: a small neodymium magnet on its free edge and another on the neighbouring panel."},
  "notice.hexa.assemblyDoor": {fr: "Montage : plante les 5 panneaux fixes dans la base et colle leurs angles ; glisse le tourillon bas de la porte dans le trou rond de la base. Plante le lanternon dans le plateau, pose le chapeau et l'anneau, puis colle cet ensemble. Pose le plateau en engageant le tourillon haut de la porte dans son trou rond, et colle le plateau : la bougie s'atteint par la porte.", en: "Assembly: plug the 5 fixed panels into the base and glue their corners; slide the door's bottom pin into the base's round hole. Plug the cupola into the top plate, add the cap and the ring, then glue that group. Set the top plate, engaging the door's top pin in its round hole, and glue the plate: the candle is reached through the door."},

  "hint.motifs": {fr: "Un SVG = soit le panneau complet vectorisé (contour, tenons et découpes : il est calé pile sur le panneau, son contour n'est pas redécoupé), soit le motif seul dessiné à la taille de la zone pleine du panneau (sans tenons). Tes motifs importés restent sur ce PC.", en: "One SVG = either the full vectorised panel (outline, tabs and cut-outs: it is fitted exactly onto the panel, its outline is not cut again), or the motif alone drawn at the size of the panel's solid area (without tabs). Your imported motifs stay on this PC."},

  "notice.lightbox.assembly": {fr: "Montage : face gravée vers l'extérieur, plante les tenons du bas de la bande dans le fond en partant de la face avant ; la charnière flexible tombe pile dans les coins. Colle au fur et à mesure, puis pose le cadre du dessus sur les tenons du haut.", en: "Assembly: engraved face outward, plug the strip's bottom tabs into the bottom starting from the front side; the flexible hinge lands right in the corners. Glue as you go, then set the top frame onto the top tabs."},

  "warn.lightbox.noDoor": {fr: "Porte retirée : la face arrière est trop étroite.", en: "Door removed: the back side is too narrow."},
  "notice.lightbox.assemblyDoor": {fr: "Montage : face gravée vers l'extérieur, plante les tenons du bas de la bande dans le fond en partant d'un montant de la porte ; la charnière flexible tombe pile dans les coins. Glisse la porte (tourillon du bas dans son trou rond), puis pose le cadre du dessus sur les tenons du haut et le tourillon du haut. Colle tout sauf la porte.", en: "Assembly: engraved face outward, plug the strip's bottom tabs into the bottom starting from one door post; the flexible hinge lands right in the corners. Slide the door in (bottom pin in its round hole), then set the top frame onto the top tabs and the top pin. Glue everything except the door."},
  "notice.lightbox.top": {fr: "Dessus : colle la plaque de scène sous le dessus déco, centrée sous sa découpe ; elle se loge dans l'ouverture du cadre. Colle ensuite le dessus déco sur le cadre : il cache les tenons et le tourillon de la porte.", en: "Top: glue the scene plate under the decor top, centered under its cut-out; it nests in the frame's opening. Then glue the decor top onto the frame: it hides the tabs and the door pin."},
  "notice.lightbox.door": {fr: "Porte de {wd} mm : charnière à droite vue de dehors, encoche pour le doigt à gauche. Colle les 2 butées à l'intérieur du montant gauche (en haut et en bas), elles dépassent de 3 mm derrière la porte : elle ne s'ouvre que vers l'extérieur. Un petit aimant la garde fermée.", en: "Door {wd} mm wide: hinge on the right seen from outside, finger notch on the left. Glue the 2 stops inside the left post (top and bottom), sticking out 3 mm behind the door: it only opens outward. A small magnet keeps it shut."},

  "err.tense.chainDepth": {fr: "Profondeur trop faible pour deux chaînes côte à côte : mets au moins {min} mm.", en: "Depth too small for two chains side by side: use at least {min} mm."},
  "notice.tense.chains": {fr: "Chaînes : au centre {nc} maillon(s) + 2 embouts à goupille ({lc} mm entre les bras) ; sur les côtés {ns} maillon(s) + 1 embout à goupille (côté bras) + 1 embout affleurant (côté plateau) ({ls} mm). Pas de maillon : {p} mm, le reste est rattrapé par les embouts (épaulement → fond de l'œil : {ac} mm au centre, {as} mm sur les côtés).", en: "Chains: in the middle {nc} link(s) + 2 pinned ends ({lc} mm between the arms); on the sides {ns} link(s) + 1 pinned end (arm side) + 1 flush end (plate side) ({ls} mm). Link pitch {p} mm, the ends take up the rest (shoulder → bottom of the eye: {ac} mm center, {as} mm sides)."},
  "notice.tense.chainAssembly": {fr: "Maillons d'une seule épaisseur, sans colle : présente le voisin (ou l'œil de l'embout) à plat, en travers, glisse-le dans la fente, tourne-le d'un quart de tour et tire-le au bout du trou. Embout à goupille : tenon dans la fente du bras, goupille enfoncée dans le trou de l'autre côté (cachée dans le creux du C). Embout affleurant : tenon collé dans la fente du plateau, à ras. Chaînes du centre d'abord.", en: "Single-layer links, no glue: hold the neighbor (or the end's eye) flat and crosswise, slip it into the slot, give it a quarter turn and pull it to the end of the hole. Pinned end: tab through the arm's slot, pin pushed through the hole on the other side (hidden inside the C). Flush end: tab glued into the plate's slot, flush. Middle chains first."},

  "err.tense.gap": {fr: "Écart entre les bras trop petit : les flancs des deux C se touchent. Mets au moins {min} mm, ou réduis la largeur des flancs.", en: "Gap between the arms too small: the two C flanks touch. Use at least {min} mm, or reduce the flank width."},
  "err.tense.overlap": {fr: "Bras trop longs pour cette largeur : réduis le dépassement ou le rayon, ou élargis la table.", en: "Arms too long for this width: reduce the overhang or the radius, or widen the table."},
  "err.tense.tooLong": {fr: "Bande trop longue pour le plateau de la machine : réduis la taille.", en: "Strip too long for the machine bed: reduce the size."},
  "notice.tense.dims": {fr: "Table {W}×{H}×{D} mm : deux C identiques de {Hc} mm de haut, bras écartés de {g} mm au centre. Bande de {L} mm par C, en {n} morceau(x).", en: "Table {W}×{H}×{D} mm: two identical C shapes {Hc} mm tall, arms {g} mm apart at the center. Strip of {L} mm per C, in {n} piece(s)."},
  "notice.tense.assembly": {fr: "Montage de chaque C : plante les tenons d'un bord de la bande dans un flanc en partant du plateau (la charnière tombe dans les coins), puis pose le deuxième flanc. Colle. Les deux C sont identiques : celui du haut est le même, retourné.", en: "Each C: plug one edge's tabs into a flank starting from the plate (the hinge lands in the corners), then add the second flank. Glue. Both C are identical: the top one is the same, flipped."},
  "notice.tense.strings": {fr: "Ficelles (fil ciré ou nylon, nœud + perle) : d'abord les 2 du centre, entre les deux bras, longueur {g} mm. Puis les 2 du côté droit (bras du bas vers plateau du haut, {a} mm) et les 2 du côté gauche (plateau du bas vers bras du haut, {b} mm). Tends-les jusqu'à ce que le haut ne bascule plus.", en: "Strings (waxed thread or nylon, knot + bead): first the 2 in the middle, between the two arms, {g} mm long. Then the 2 on the right (bottom arm to top plate, {a} mm) and the 2 on the left (bottom plate to top arm, {b} mm). Tighten until the top no longer tilts."},
  "notice.tense.led": {fr: "Colle l'anneau au centre du plateau du haut, entre les trous de ficelle : il garde la bougie LED en place.", en: "Glue the ring in the middle of the top plate, between the string holes: it keeps the LED candle in place."},

  "guide.chain.note1": {fr: "Les pièces se croisent toujours à 90° : c'est ce qui permet à un maillon de passer dans le suivant. Les goupilles restent cachées dans le creux des C.", en: "Pieces always cross at 90°: that's what lets one link pass through the next. The pins stay hidden inside the C shapes."},

  "guide.tense.join": {fr: "Trait orange = jonction de bande : colle les morceaux bout à bout, les tenons dans les flancs tiennent la jonction.", en: "Orange mark = strip joint: glue the pieces end to end, the tabs in the flanks hold the joint."},

      if (nx === undefined) return null;
      segs.push([pos, nx]); pos = nx;
    }
    segs.push([pos, start + L]);
    return segs;
  };
  let segs = null;
  if (door) segs = split(arcS[3] - dj, P - Fl[2] + 2 * dj);
  else for (const c of cuts0) { const s = split(c, P); if (s && (!segs || s.length < segs.length)) segs = s; }
  if (!segs) throw new Error(tt("err.lightbox.tooLong", {len: f1(Math.max(...Fl) + q)}));
  // Fenêtres des faces (face arrière : sur la porte)
  const mw = Math.max(v.margeF, J + 2), wins = [];
  let missing = false;
  for (let i = 0; i < 4; i++) {
    const w = (i === 2 && door ? wd : Fl[i]) - 2 * mw, h = Hb - 2 * mw;
    if (v.fenetres === "aucune") { wins.push(null); continue; }
    if (w < 15 || h < 15) { wins.push(null); missing = true; continue; }
    wins.push({s0: arcS[i] + q + mw, w, h});
  }
  if (missing) warns.push(tt("warn.lightbox.noWindow"));
  const pieces = [];
  // Fond et cadre du dessus : mêmes mortaises (posés tous les deux face gravée vers le haut) + trou des tourillons
  const b = bbox(outline), sh = p => shift(p, -b[0], -b[1]), neu = sh(neutral);
  const slotsOf = list => list.map(tb => { const [x, y, a] = pointAt(neu, tb.S * sc, true); return slotD(x, y, a, tw - k, t - k + (tb.arc ? tw * tw / (8 * rho) : 0)); }).join("");
  const slots = slotsOf(tabs);
  const hole = door ? (() => { const [x, y] = pointAt(neu, pinS * sc, true); return polyD(arc(x, y, (t * Math.SQRT2 + 0.5 - k) / 2, 0, 2 * Math.PI, [])); })() : "";
  const plate = name => ({name, w: b[2] - b[0], h: b[3] - b[1], els: [{k: "cut", d: polyD(sh(outline))}]});
  const fond = plate(tt("piece.bottom")); fond.els.push({k: "cut", d: slots + hole});
  if (slide) {
    // Glissière : ouverture en U sur toute la face arrière plane (la bande passe au-dessus), jusqu'à 3 mm de la paroi avant
    const [cx, cy] = [-b[0], -b[1]], uw = Fl[2] - 2, uy1 = cy + Df / 2 - 3, jf = 0.3, led = 5;
    const g = plate(tt("piece.slideFrame"));
    g.els.push({k: "cut", d: slotsOf(tabsBot)}, {k: "cut", d: polyD([[cx - uw / 2, -1], [cx + uw / 2, -1], [cx + uw / 2, uy1], [cx - uw / 2, uy1]])});
    const rb = plate(tt("piece.slideLedge"));
    rb.els.push({k: "cut", d: polyD(roundRectPts(cx - uw / 2 + led, cy - Df / 2 + led, cx + uw / 2 - led, uy1 - led, 4))});
    const pw = uw - 2 * jf, pd = uy1 - jf, panel = rectPiece(tt("piece.slidePanel"), pw, pd);
    panel.els = [{k: "cut", d: polyD(circleEdit([[0, 0], [pw, 0], [pw, pd], [0, pd]], pw / 2, 0, 9, "cut"))}];
    pieces.push(g, rb, panel);
    info.push(tt("notice.tissue.slide", {w: f1(pw), d: f1(pd)}));
  }
  // Cadre du dessus : ouvert au centre (à hm mm de la paroi) pour la lumière et la plaque de scène du dessus
  const hm = 4, frame = plate(tt("piece.topFrame")); frame.els.push({k: "cut", d: slots + hole}, {k: "cut", d: polyD(sh(shapePts(sv, -hm)))});
  pieces.push(...(cover ? [] : [fond]), frame);
  // Plaque déco du dessus : collée sur le cadre, cache les tenons, porte la découpe déco
  const deco = plate(tt("piece.topDeco")), [ox, oy] = [-b[0], -b[1]], rec = v.plaques ? v.recouv : 0, extra = [];
  const hx0 = Wf / 2 - hm - 0.5, hy0 = Df / 2 - hm - 0.5;
  if (v.ouvTop === "cercle") {
    let R = Math.min(Wf, Df) / 2 * v.ouvPct / 100;
    if (R + rec > Math.min(hx0, hy0)) { R = Math.min(hx0, hy0) - rec; warns.push(tt("warn.lightbox.lidOpening")); }
    if (R >= 7.5) {
      deco.els.push({k: "cut", d: polyD(arc(ox, oy, R, 0, 2 * Math.PI, []))});
      if (v.plaques) { const Rp = R + rec; extra.push({name: tt("piece.sceneTop"), w: 2 * Rp, h: 2 * Rp, els: [{k: "cut", d: polyD(arc(Rp, Rp, Rp, 0, 2 * Math.PI, []))}]}); }
    }
  } else if (v.ouvTop === "fente") {
    // Fente arrondie dans le sens de la longueur (bouts en demi-cercle)
    const along = Wf >= Df, L2 = (along ? Wf : Df) / 2 * v.ouvPct / 100, w2 = v.ouvW / 2;
    const lx = Math.min(along ? L2 : w2, hx0), ly = Math.min(along ? w2 : L2, hy0);
    if (lx < (along ? L2 : w2) - 1e-6 || ly < (along ? w2 : L2) - 1e-6) warns.push(tt("warn.lightbox.lidOpening"));
    if (Math.min(lx, ly) >= 5) deco.els.push({k: "cut", d: polyD(roundRectPts(ox - lx, oy - ly, ox + lx, oy + ly, Math.min(lx, ly)))});
  } else if (v.ouvTop === "rect") {
    const want = [Wf / 2 * v.ouvPct / 100, Df / 2 * v.ouvPct / 100], hx = Math.min(want[0], hx0 - rec), hy = Math.min(want[1], hy0 - rec);
    if (hx < want[0] - 1e-6 || hy < want[1] - 1e-6) warns.push(tt("warn.lightbox.lidOpening"));
    if (Math.min(hx, hy) >= 7.5) {
      const rr = Math.max(2, r * v.ouvPct / 100);
      deco.els.push({k: "cut", d: polyD(roundRectPts(ox - hx, oy - hy, ox + hx, oy + hy, rr))});
      if (v.plaques) { const px = 2 * (hx + rec), py = 2 * (hy + rec), rp = Math.max(rr + rec, r - hm); extra.push({name: tt("piece.sceneTop"), w: px, h: py, els: [{k: "cut", d: polyD(roundRectPts(0, 0, px, py, rp))}]}); }
    }
  }
  pieces.push(deco);
  // Bandes : tenons en haut et en bas, charnière seulement dans les coins, fenêtres sur les faces planes
  segs.forEach(([s0, s1], gi) => {
    const len = s1 - s0, xOf = S => mod(S - s0);
    const tx = tabs.map(tb => xOf(tb.S)).filter(x => x - tw / 2 > 0.3 && x + tw / 2 < len - 0.3).sort((a, c) => a - c);
    const bx = tabsBot.map(tb => xOf(tb.S)).filter(x => x - tw / 2 > 0.3 && x + tw / 2 < len - 0.3).sort((a, c) => a - c);
    const s = stripPoly(len, Hb, t, tx, bx, tw + k), els = [{k: "cut", d: polyD(s.pts)}];
    for (let i = 0; i < 4; i++) { const x0 = xOf(arcS[i]); if (x0 + q <= len + 1e-6) els.push({k: "cut", d: hinge(Math.max(1, x0 - ext), Math.min(len - 1, x0 + q + ext), s.y0, s.y1, v, tx, bx, tw + k)}); }
    for (let i = 0; i < 4; i++) if (wins[i] && !(i === 2 && door)) { const x0 = xOf(wins[i].s0); if (x0 + wins[i].w <= len + 1e-6) els.push({k: "cut", d: polyD(windowPts(v.fenetres, x0, s.y0 + mw, x0 + wins[i].w, s.y0 + mw + wins[i].h, v.rayonF))}); }
    pieces.push({name: segs.length > 1 ? tt("piece.stripN", {i: gi + 1, n: segs.length}) : tt("piece.strip"), w: len, h: s.h, els});
  });
  // Porte : tourillons t×t en haut et en bas côté charnière, encoche pour le doigt de l'autre côté, sa fenêtre
  if (door) {
    const s = tabbedRect(wd, Hb, t, t, {top: [wd - ep], bottom: [wd - ep]});
    const els = [{k: "cut", d: polyD(circleEdit(s.pts, 0, s.oy + Hb / 2, 6, "cut"))}];
    if (wins[2]) els.push({k: "cut", d: polyD(windowPts(v.fenetres, mw, s.oy + mw, mw + wins[2].w, s.oy + mw + wins[2].h, v.rayonF))});
    pieces.push({name: tt("piece.hexDoor"), w: s.W, h: s.H, els});
    for (let i = 0; i < 2; i++) pieces.push(rectPiece(tt("piece.doorStop"), dj - 2 + dg + 3, 12));
  }
  // Plaques de scène vierges, collées à l'intérieur derrière chaque fenêtre (sur la porte : sans toucher les butées)
  const names = ["piece.sceneFront", "piece.sceneRight", "piece.sceneDoor", "piece.sceneLeft"], plates = [];
  if (v.plaques) wins.forEach((wn, i) => {
    if (!wn) return;
    const room = i === 2 && door ? wd - 8 : Fl[i] - 2;
    const pw = Math.min(wn.w + 2 * rec, room), ph = Math.min(wn.h + 2 * rec, Hb - 2 * (t + 1));
    if (pw >= wn.w + 2 && ph >= wn.h + 2) plates.push(rectPiece(tt(i === 2 && !door ? "piece.sceneBack" : names[i]), pw, ph));
  });
  pieces.push(...plates, ...extra);
  if (v.socle) {
    const ri = v.socleD / 2 + 0.3, ro = ri + 5;
    if (2 * ro <= Math.min(Wf, Df) - 2) pieces.push({name: tt("piece.ledRing"), w: 2 * ro, h: 2 * ro, els: [{k: "cut", d: polyD(arc(ro, ro, ri, 0, 2 * Math.PI, []))}, {k: "cut", d: polyD(arc(ro, ro, ro, 0, 2 * Math.PI, []))}]});

  if (v.calque) for (const p of [...plates, ...extra]) pieces.push({...rectPiece(tt("piece.paperScene", {name: p.name}), p.w - 1, p.h - 1), paper: true});

  if (cover) {
    info.unshift(tt(slide ? "notice.tissue.dimsClosed" : "notice.tissue.dims", {L: v.boxL, W: v.boxW, H: v.boxH, oL: f1(v.W), oW: f1(v.D), oH: f1(v.H), r: f1(r), P: Ptot, n: segs.length}));
    info.push(tt("notice.tissue.assembly"));
    if (v.hSpace > t * 0.9) warns.push(tt("warn.shape.hingeSpacing"));

  }
  info.push(tt("notice.lightbox.dims", {W: v.W, D: v.D, H: v.H, r: f1(r), P: Ptot, n: segs.length, Hb: f1(Hb)}));
  if (wins.some(Boolean)) {
    const wf = wins[0] || wins[2], ws = wins[1] || wins[3];
    info.push(tt("notice.lightbox.windows", {wf: wf ? f1(wf.w) : "–", ws: ws ? f1(ws.w) : "–", hf: f1((wf || ws).h)}));

  }
  info.push(tt(door ? "notice.lightbox.assemblyDoor" : "notice.lightbox.assembly"), tt("notice.lightbox.top"));
  if (door) info.push(tt("notice.lightbox.door", {wd: f1(wd)}));
  if (v.socle) info.push(tt("notice.lantern.ring"));
  info.push(tt("notice.lantern.led"));
  if (v.hSpace > t * 0.9) warns.push(tt("warn.shape.hingeSpacing"));
  return {pieces, info, warns};
}

// Boîte à mouchoirs : housse sans fond posée sur la boîte en carton du commerce
function genTissue(v) {
  const t = v.t, j = v.jeuBox;
  return genLightbox({...v, housse: true, W: v.boxL + 2 * (j + t), D: v.boxW + 2 * (j + t), H: v.boxH + j + (v.fondT === "coulissant" ? 4 : 2) * t,
    fenetres: "aucune", plaques: false, calque: false, porte: false, socle: false, margeF: 12, rayonF: 0});
}

// ---------- Table tensegrity : deux C identiques (le haut = le bas retourné), tenus par 3 paires de ficelles ----------
// Un C (vue de côté, y vers le haut) : plateau du bas, coin, paroi droite, coin, bras qui revient vers la gauche.
// Bande flexible pliée entre deux flancs en C (tenons des deux côtés), charnière seulement dans les coins.
// Triangle rétréci : le côté i (sommets i -> i+1) recule de o[i] vers l'intérieur
function insetTri(A, B, C, o) {
  const P = [A, B, C], cx = (A[0] + B[0] + C[0]) / 3, cy = (A[1] + B[1] + C[1]) / 3;
  const lines = P.map((p, i) => {
    const q = P[(i + 1) % 3], dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy);
    let nx = -dy / l, ny = dx / l; if ((cx - p[0]) * nx + (cy - p[1]) * ny < 0) { nx = -nx; ny = -ny; }
    return [p[0] + nx * o[i], p[1] + ny * o[i], dx, dy];
  });
  // Sommet i = intersection des côtés i-1 et i
  return lines.map((L1, i) => {
    const [x1, y1, dx1, dy1] = lines[(i + 2) % 3], [x2, y2, dx2, dy2] = L1, u = ((x2 - x1) * dy2 - (y2 - y1) * dx2) / (dx1 * dy2 - dy1 * dx2);
    return [x1 + dx1 * u, y1 + dy1 * u];
  });
}

// Cotes des chaînes en bois (partagées avec le schéma de montage) : barre cb, trou Wi × Li (pas), ouverture gap, tenon tcw
function chainDims(t) {
  // Maillon d'une seule couche ouvert par une fente de l'épaisseur du bois : le voisin entre à plat (son épaisseur t passe),
  // puis tourne d'un quart de tour dans le trou -> trou large de la diagonale de la barre (cb × t) + jeu
  const cb = 4.5, Wi = Math.hypot(cb, t) + 0.5, Wo = Wi + 2 * cb, gap = t + 0.05, Li = Math.max(2 * cb + 2, Wi + gap + 2), aeMin = cb + Wi;
  // Les bouts des trous sont des demi-cercles (rayon Wi/2) : une barre de demi-épaisseur h n'atteint pas le fond, elle s'arrête
  // r - √(r² - h²) avant. Chaque jonction croise deux barres d'épaisseur t : perte 2 × loss(t/2)
  // (oubli constaté sur la 1re table montée : chaînes trop courtes)
  const r = Wi / 2, loss = h => r - Math.sqrt(Math.max(0, r * r - h * h)), lj = 2 * loss(t / 2);
  // Chaîne de longueur S entre les épaulements : n maillons (n + 1 jonctions), embouts de longueur ae (épaulement -> fond de l'œil)
  const fit = S => {
    const n = Math.floor((S - 2 * aeMin) / Li); if (n < 1) return null;
    return {n, ae: (S - n * Li + (n + 1) * lj) / 2};
  };
  return {cb, Wi, Wo, gap, Li, Lo: Li + 2 * cb, tcw: t + 4.5, aeMin, fit};
}

// Jonctions de bande du dernier rendu (pour le schéma) : partie b = plateau, w = paroi, a = bras ; f = position relative
let tenseCuts = [];
function genTense(v) {
  const {W, H, D, t, kerf: k, tabW: tw} = v, m = v.rebord, bord = v.bordC, e = v.depasse, info = [], warns = [];
  const Hc = (H + v.ecart) / 2, La = W / 2 + e, Dw = D - 2 * t;
  const R = Math.max(t + 2, Math.min(v.rayon, (Hc - 4) / 2, La - 12)), rho = R - t / 2, q = Math.PI / 2 * rho;
  const gapFl = v.ecart - t - 2 * bord;
  if (Dw < 3 * tw || W < 4 * R + 20) throw new Error(tt("err.tense.tooSmall"));
  if (gapFl < 4) throw new Error(tt("err.tense.gap", {min: f1(t + 2 * bord + 4)}));
  if (W / 2 - e - R - 8 < 6) throw new Error(tt("err.tense.overlap"));
  // Courbe du C décalée de d (d > 0 vers l'extérieur), y vers le haut
  const cPts = d => {
    const r = Math.max(0.3, rho + d), p = [[0, t / 2 - d]];
    arc(W - R, R, r, -Math.PI / 2, 0, p); arc(W - R, Hc - R, r, 0, Math.PI / 2, p);
    p.push([W - La, Hc - t / 2 + d]);
    return p;
  };
  // Abscisses sur la fibre neutre : plateau, coin 1, paroi, coin 2, bras
  const Lb = W - R, Lw = Hc - 2 * R, Lr = La - R, sA1 = Lb, sW0 = Lb + q, sA2 = sW0 + Lw, sR0 = sA2 + q, total = sR0 + Lr;
  // Coupes éventuelles (bande trop longue pour le plateau) : au milieu des parties planes
  const [bw, bh] = bedOf(v), maxLen = Math.max(bw, bh) - 4, mids = [Lb / 2, sW0 + Lw / 2, sR0 + Lr / 2].filter((x, i) => [Lb, Lw, Lr][i] > 2 * tw + 12);
  const cuts = []; let pos = 0;
  while (total - pos > maxLen) { const nx = mids.filter(c => c > pos + 1 && c <= pos + maxLen).pop(); if (nx === undefined) throw new Error(tt("err.tense.tooLong")); cuts.push(nx); pos = nx; }
  // Tenons : parties planes (découpées aux coupes) + un ou deux par coin (fentes élargies de la flèche)
  const flats = [[0, Lb], [sW0, sA2], [sR0, total]], tabs = [];
  for (const [a, b] of flats) { const pts = [a, ...cuts.filter(c => c > a && c < b), b]; for (let i = 0; i < pts.length - 1; i++) for (const c of tabCenters(pts[i + 1] - pts[i], v)) tabs.push({S: pts[i] + c}); }
  for (const a of [sA1, sA2]) for (const c of tabCenters(q, v)) tabs.push({S: a + c, arc: true});
  // Trous de ficelle (x vue de côté -> abscisse) : plateau à R+8, bras à W-R-8 et au centre W/2
  const holes = [R + 8, sR0 + 8, sR0 + W / 2 - R];
  // Chaînes (option) : maillons de 2 demi-maillons ouverts collés à plat (épaisseur 2t), pas fixe ;
  // embouts sur mesure qui rattrapent le reste : tenon + goupille côté bras (caché dans le C), tenon affleurant collé côté plateau
  const chain = v.lien === "chaine", {cb, Wi, Wo, gap, Li, Lo, tcw, aeMin, fit} = chainDims(t), cy0 = chain ? Math.max(6, Wo / 2 + 2) : 6;
  const Sc = v.ecart - 2 * t, Ss = H - Hc - t;
  const chainOf = S => { const c = fit(S); if (!c) throw new Error(tt("err.tense.chainShort", {min: f1(2 * aeMin + Li)})); return c; };
  const chC = chain ? chainOf(Sc) : null, chS = chain ? chainOf(Ss) : null;
  if (chain && Dw - 2 * cy0 < Wo + 4) throw new Error(tt("err.tense.chainDepth", {min: f1(4 * cy0 + 4 + 2 * t)}));
  // Trou i -> chaîne : 0 = plateau (côté), 1 = bras (côté), 2 = bras (centre). Nombre pair de maillons : l'autre bout est tourné de 90°
  const chainAt = [chS, chS, chC];
  // Flancs : C plein entre l'extérieur de la bande (+ rebord) et un bord intérieur de bordC
  tenseCuts = cuts.map(c => c < Lb ? {part: "b", f: c / Lb} : c < sR0 ? {part: "w", f: (c - sW0) / Lw} : {part: "a", f: (c - sR0) / Lr});
  // Bouts des flancs arrondis : petit congé (rebord) côté extérieur, la bande reste soutenue ; grand congé côté intérieur
  const outer = cPts(t / 2 + m), inner = cPts(-bord).reverse(), xa = W - La, ri = Math.max(0, bord - t / 2 - 0.5);
  const fil = (cx, cy, r, a0, a1) => r > 0.2 ? arc(cx, cy, r, a0, a1, []) : [[cx + r * Math.cos(a0), cy + r * Math.sin(a0)]];
  outer.splice(0, 1, ...fil(m, 0, m, Math.PI, 1.5 * Math.PI)); outer.splice(-1, 1, ...fil(xa + m, Hc, m, Math.PI / 2, Math.PI));
  inner.splice(0, 1, ...fil(xa + ri, Hc - t / 2 - bord + ri, ri, Math.PI, 1.5 * Math.PI)); inner.splice(-1, 1, ...fil(ri, t / 2 + bord - ri, ri, Math.PI / 2, Math.PI));
  const all = [...outer, ...inner], bb = bbox(all);
  const toP = ([x, y]) => [x - bb[0], bb[3] - y], neu = cPts(0).map(toP);
  // Motif treillis (option) : triangles alternés dans la partie pleine des flancs, entre les mortaises et le bord intérieur,
  // sur les parties droites seulement (plateau, paroi, bras) ; barres de 2,5 mm
  const truss = [];
  if (v.motif === "treillis") {
    const w = 2.5, d1 = t / 2 + w, h = bord - w - d1;
    if (h < 4) warns.push(tt("warn.tense.truss", {min: f1(t / 2 + 4 + 2 * w)}));
    else for (const [a, b, nI] of [[[ri + w, t / 2], [W - R - w, t / 2], [0, 1]], [[W - t / 2, R + w], [W - t / 2, Hc - R - w], [-1, 0]], [[W - R - w, Hc - t / 2], [xa + ri + w, Hc - t / 2], [0, -1]]]) {
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]), u = [(b[0] - a[0]) / L, (b[1] - a[1]) / L], N = Math.floor(L / (1.15 * h));
      if (N < 1) continue;
      const P = L / N, pt = ([sx, y]) => [a[0] + u[0] * sx + nI[0] * (d1 + y), a[1] + u[1] * sx + nI[1] * (d1 + y)];
      for (let i = 0; i < N; i++) truss.push(insetTri([i * P, 0], [(i + 1) * P, 0], [(i + .5) * P, h], [0, w / 2, w / 2]).map(pt));
      for (let i = 0; i < N - 1; i++) truss.push(insetTri([(i + 1.5) * P, h], [(i + .5) * P, h], [(i + 1) * P, 0], [0, w / 2, w / 2]).map(pt));
    }
  }
  const trussC = truss.map(tr => tr.map(toP));
  let acc = 0; for (let i = 0; i < neu.length - 1; i++) { acc += Math.hypot(neu[i + 1][0] - neu[i][0], neu[i + 1][1] - neu[i][1]); }
  const sc = acc / total;
  const fw = bb[2] - bb[0], fh = bb[3] - bb[1], outline = all.map(toP);
  const slotXY = tabs.map(tb => [...pointAt(neu, tb.S * sc, false), tb.arc]);
  const flankEls = f => [{k: "cut", d: polyD(outline.map(f))},
    {k: "cut", d: slotXY.map(([x, y, a, ar]) => { const [X, Y] = f([x, y]); return slotD(X, Y, a, tw - k, t - k + (ar ? tw * tw / (8 * rho) : 0)); }).join("")},
    ...(trussC.length ? [{k: "cut", d: trussC.map(tr => polyD(tr.map(f))).join("")}] : [])];
  // Paire imbriquée : le 2e flanc retourné (180°) glisse son bras dans le creux du premier, ça économise presque un flanc de bois

    const endPiece = (name, ae, pin) => {

}

const GEN = {box: genBox, shape: genShape, chest: genChest, orga: genOrga, tray: genTray, lantern: genLantern, hexa: genHexa, advent: genAdvent, lightbox: genLightbox, tissue: genTissue, tense: genTense};

// ---------- Placement ----------
// Rangées « first fit » : chaque pièce (la plus basse des deux orientations d'abord) va dans la première rangée
// déjà ouverte où elle tient, sur n'importe quelle planche, avant d'ouvrir une nouvelle rangée ou planche.
// Deux essais (pièces couchées d'abord, puis debout d'abord) : on garde celui qui prend le moins de planches.
function layout(pieces, bw, bh) {

  for (const {p, o} of items) {
    let done = false;

      const f = o.find(([w, h]) => h <= r.h + eps && r.x + w <= bw - M + eps);

    }
    if (done) continue;
    // Nouvelle rangée : première planche où l'une des orientations tient (dans l'ordre de préférence), sinon nouvelle planche
    let s = -1, f = o[0];
    for (let i = 0; i < sheets.length && s < 0; i++) { const g = o.find(([, gh]) => nextY(i) + gh <= bh - M + eps); if (g) { s = i; f = g; } }

    const [w, h, rot] = f;
    const y = nextY(s);

    sheets[s].push({p, w, h, rot, x: M, y});
  }
  // Compactage : les pièces des dernières planches vont dans les vides des premières
  // (bout des rangées, bas de planche, creux déclarés par une pièce dans p.free = [[x, y, w, h], ...])
  const free = sheets.map((sh, s) => {
    const f = rows.filter(r => r.s === s).map(r => [r.x, r.y, bw - M - r.x, r.h]), y = nextY(s);

    for (const [f, i] of F) for (const [w, h, rot] of [[p.w, p.h, false], [p.h, p.w, true]]) {

}

// ---------- Texte -> tracés ----------
const fontCache = {};

}
// Taille = hauteur des majuscules visée ; en aperçu, groupe déplaçable avec zone de prise
function textSvg(el, font, fam, preview) {

    let w = font.getAdvanceWidth(el.str, size);
    if (el.maxW && w > el.maxW) { const k = el.maxW / w; size *= k; cap *= k; w = el.maxW; } // étiquette trop longue : on réduit
    const path = font.getPath(el.str, el.x - w / 2, el.y + cap / 2, size);
    inner = `<path class="engrave" d="${path.toPathData(3)}" fill="#000000" stroke="none"/>`;
    const bb = path.getBoundingBox(); box = [bb.x1, bb.y1, bb.x2 - bb.x1, bb.y2 - bb.y1];
  } else {
    const size = el.size * 1.4, w = 0.55 * size * el.str.length;
    inner = `<text x="${f3(el.x)}" y="${f3(el.y)}" font-size="${f3(size)}" text-anchor="middle" dominant-baseline="middle" font-family="${esc(fam)}, cursive" fill="#000000">${esc(el.str)}</text>`;
    box = [el.x - w / 2, el.y - size / 2, w, size];
  }
  if (!preview || !el.id) return inner;
  return `<g data-ti="${el.id}"><rect class="grab" x="${f3(box[0] - 1)}" y="${f3(box[1] - 1)}" width="${f3(box[2] + 2)}" height="${f3(box[3] + 2)}" fill="transparent"/>${inner}</g>`;
}

// Glisser = déplacer (aimanté au centre horizontal), molette = taille
function bindTextDrag(g, v) {
  const id = g.dataset.ti, cur = () => (state.values[state.tab] = state.values[state.tab] || {});
  g.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation(); g.setPointerCapture(e.pointerId);
    const inv = g.parentNode.getScreenCTM().inverse(), p0 = new DOMPoint(e.clientX, e.clientY).matrixTransform(inv);
    const tx0 = v["tx" + id] || 0, ty0 = v["ty" + id] || 0; let dx = 0, dy = 0;
    const move = ev => {
      const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(inv); dx = p.x - p0.x; dy = p.y - p0.y;
      if (Math.abs(tx0 + dx) < 1.5) dx = -tx0;
      g.setAttribute("transform", `translate(${f3(dx)},${f3(dy)})`);
    };
    const up = () => {
      g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up);
      if (Math.abs(dx) + Math.abs(dy) > 0.05) { const c = cur(); c["tx" + id] = tx0 + dx; c["ty" + id] = ty0 + dy; save(); render(); }
    };
    g.addEventListener("pointermove", move); g.addEventListener("pointerup", up);
  });
  g.addEventListener("wheel", e => {
    e.preventDefault(); e.stopPropagation();
    const key = id === "2" && v.texte && v.texte2 ? "taille2" : "taille", c = cur();
    c[key] = Math.max(2, Math.round((v[key] * (e.deltaY < 0 ? 1.08 : 1 / 1.08)) * 2) / 2); v[key] = c[key];
    save(); const f = $("#f_" + key); if (f) f.value = c[key]; schedule();
  }, {passive: false});
}

// ---------- Rendu ----------
function sheetSvg(sheet, bw, bh, v, font, idx, total, preview) {
  let body = "";
  for (const it of sheet) {
    const tf = it.rot ? `translate(${f3(it.x + it.w)},${f3(it.y)}) rotate(90)` : `translate(${f3(it.x)},${f3(it.y)})`;
    let g = "";
    for (const el of it.p.els) {
      if (el.k === "cut") g += `<path class="cut" d="${el.d}" fill="none" stroke="#ff0000" stroke-width="0.1"/>`;
      else if (el.k === "fill") g += `<path class="engrave-fill" d="${el.d}" fill="#000000" fill-rule="evenodd" stroke="none"/>`;
      else if (el.k === "cutT") g += `<path class="cut" d="${el.d}" transform="${el.tf}" fill="none" stroke="#ff0000" stroke-width="${f3(el.sw)}"/>`;
      else if (el.k === "line") g += `<path class="engrave-line" d="${el.d}" fill="none" stroke="#000000" stroke-width="0.3"/>`;
      else if (el.k === "text") g += textSvg(el, font, v.police, preview);
    }
    if (v.reperes && preview) g += `<text x="${f3(it.p.w / 2)}" y="${f3(Math.min(it.p.h - 2, it.p.h * 0.18 + 3))}" font-size="3.2" text-anchor="middle" fill="#0000ff" font-family="Arial">${esc(it.p.name)}</text>`;
    body += `<g transform="${tf}">${g}</g>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${bw}mm" height="${bh}mm" viewBox="0 0 ${bw} ${bh}">\n<!-- ${tt("export.svgComment", {name: esc(state.name), idx, total})} -->\n${body}\n</svg>`;
}
const PX = 3; // pixels par mm à 100 %
let timer = null, lastFiles = [], lastInfo = [], needFit = true, currentSheet = 0;
const view = {z: 1, x: 0, y: 0};

function applyView() { $("#canvas").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`; $("#zoomPct").textContent = Math.round(view.z * 100) + "%"; }
function fit(el) {

  const pad = 36; view.z = Math.max(0.05, Math.min((vp.width - 2 * pad) / w, (vp.height - 2 * pad) / h, 4));
  view.x = (vp.width - w * view.z) / 2 - bx * view.z; view.y = (vp.height - h * view.z) / 2 - by * view.z; applyView();
}
function zoomAt(f, cx, cy) { const nz = Math.min(8, Math.max(0.05, view.z * f)); view.x = cx - (cx - view.x) * nz / view.z; view.y = cy - (cy - view.y) * nz / view.z; view.z = nz; applyView(); }

function initViewport() {
  const vp = $("#viewport");

  if (needsText && !font) warns.push(String(v.police).startsWith("local:") ? tt("warn.fontLocal") : tt("warn.fontMissing"));
  $("#warns").innerHTML = warns.map(w => `<div class="warn">⚠️ ${esc(w)}</div>`).join("");
  const base = slug(state.name) + "_" + ({box: `boite_${v.L}x${v.W}x${v.H}`, shape: `${v.forme}_${v.W}x${v.H}`, chest: `coffre_${v.L}x${v.W}x${v.H}`, orga: `organiseur_${v.W}x${v.D}`, tray: `casier_${v.W}x${v.D}`, lantern: `lanterne_${v.L}x${v.W}x${v.H}`, hexa: `lanterne-hexa_${v.a}x${v.H}`, advent: `calendrier_${v.W}x${v.D}`, lightbox: `boite-lumineuse_${v.W}x${v.D}x${v.H}`, tissue: `boite-mouchoirs_${v.boxL}x${v.boxW}x${v.boxH}`, tense: `tensegrity_${v.W}x${v.H}x${v.D}`}[state.tab]);
  lastFiles = sheets.map((s, i) => ({name: sheets.length > 1 ? `${base}_planche${i + 1}${s.paper ? "_calque" : s.felt ? "_feutrine" : s.decor ? "_decor" : ""}.svg` : `${base}.svg`, svg: sheetSvg(s, bw, bh, v, font, i + 1, sheets.length, false)}));
  lastInfo = res.info;
  const cols = Math.min(2, sheets.length), c = $("#canvas");
  c.style.width = (cols * bw * PX + (cols - 1) * 48) + "px";
  const isTray = state.tab === "tray", td = isTray ? trayData() : null;
  const plan = isTray ? `<div class="sheet plan-card" data-si="-2" style="width:${bw * PX}px"><div class="lbl"><span><b>${tt("sheet.topView")}</b> · ${tt("sheet.layerOf", {cur: td.cur + 1, total: td.layers.length})}</span><span>${tt("sheet.planHelp")}</span></div>${planSvg(v)}</div>` : "";
  c.innerHTML = plan + sheets.map((s, i) => `<div class="sheet${s.decor || s.felt || s.paper ? " decor" : ""}" data-si="${i}" style="width:${bw * PX}px"><div class="lbl"><span><b>${tt("sheet.card", {n: i + 1})}</b> · ${tt("sheet.pieceCount", {n: s.length, s: s.length > 1 ? "s" : ""})}${s.decor || s.felt || s.paper ? `<span class="tag">${tt(s.paper ? "sheet.paperTag" : s.felt ? "sheet.feltTag" : "sheet.decorTag")}</span>` : ""}</span><button class="mini" data-dl="${i}">${icon("download", 14)}${tt("sheet.svgBtn")}</button></div>${sheetSvg(s, bw, bh, v, font, i + 1, sheets.length, true)}</div>`).join("");
  c.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => { const f = lastFiles[+b.dataset.dl]; downloadBlob(f.name, new Blob([f.svg], {type: "image/svg+xml"})); });
  c.querySelectorAll("[data-ti]").forEach(g => bindTextDrag(g, v));
  if (isTray) bindPlan(c.querySelector("svg.plan"), v);
  if (currentSheet >= sheets.length || (currentSheet === -2 && !isTray)) currentSheet = 0;
  $("#sheetTabs").innerHTML = (isTray ? `<button class="chip" data-si="-2" aria-pressed="${currentSheet === -2}">${tt("sheet.plan")}</button>` : "") + `<button class="chip" data-si="-1" aria-pressed="${currentSheet === -1}">${tt("sheet.all")}</button>` + sheets.map((s, i) => `<button class="chip" data-si="${i}" aria-pressed="${i === currentSheet}">${s.paper ? "📄 " : s.felt ? "🧵 " : s.decor ? "🎨 " : ""}${tt("sheet.n", {n: i + 1})}</button>`).join("");
  $("#sheetTabs").querySelectorAll("[data-si]").forEach(b => b.onclick = () => { currentSheet = +b.dataset.si; markTabs(); fit(currentSheet === -1 ? null : c.querySelector(`.sheet[data-si="${currentSheet}"]`)); });
  markTabs();
  // Barre d'état : pièces, planches, occupation du bois (boîtes englobantes, approximatif)
  const mainSheets = sheets.filter(s => !s.decor && !s.felt && !s.paper), area = mainSheets.flat().reduce((a, it) => a + it.w * it.h, 0);
  const pct = mainSheets.length ? Math.round(100 * area / (mainSheets.length * bw * bh)) : 0;
  $("#status").innerHTML = `<span>${tt("status.pieces", {n: res.pieces.length})}</span><span>${tt("status.sheets", {n: sheets.length, s: sheets.length > 1 ? "s" : "", bw, bh})}</span><span>${tt("status.woodUsed", {pct})}</span>${warns.length ? `<span class="bad">${tt("status.alerts", {n: warns.length, s: warns.length > 1 ? "s" : ""})}</span>` : `<span class="ok">${tt("status.ready")}</span>`}
    <span class="legend"><span><i style="background:#ff0000"></i>${tt("status.legend.cut")}</span><span><i style="background:#000;outline:1px solid var(--line)"></i>${tt("status.legend.engrave")}</span><span><i style="background:#0000ff"></i>${tt("status.legend.marks")}</span><a href="https://www.youtube.com/@NeoProdFX" target="_blank" rel="noopener">${tt("status.offeredBy")}</a></span>`;
  $("#info").innerHTML = `<ul>${res.info.map(i => `<li>${esc(i)}</li>`).join("")}<li>${tt("info.kerfTip", {t: f1(v.t), k: f1(v.kerf)})}</li></ul><button class="btn ghost sm" id="openGuide" style="margin-top:8px">${icon("book", 15)}${tt("info.viewGuide")}</button>`;
  $("#openGuide").onclick = openGuide;
  if (needFit) { needFit = false; requestAnimationFrame(() => fit(currentSheet === -1 ? null : c.querySelector(`.sheet[data-si="${currentSheet}"]`))); }
}

// ---------- Export ----------
function downloadBlob(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
async function doExport(kind) {
  if (!lastFiles.length) { toast(tt("toast.nothingToExport")); return; }
  const pj = new Blob([JSON.stringify(projectData(), null, 2)], {type: "application/json"}), s = slug(state.name);
  if (kind === "json") return downloadBlob(`${s}.lasertoolfx.json`, pj);
  if (kind === "sheet") { const f = lastFiles[Math.max(0, currentSheet)]; return downloadBlob(f.name, new Blob([f.svg], {type: "image/svg+xml"})); }
  const notice = tt("export.notice", {name: state.name, steps: lastInfo.join("\n- ")});
  if (window.JSZip) {
    const zip = new JSZip(), dir = zip.folder(s);
    lastFiles.forEach(f => dir.file(f.name, f.svg)); dir.file(`${s}.lasertoolfx.json`, pj); dir.file("NOTICE.txt", notice);
    downloadBlob(`${s}.zip`, await zip.generateAsync({type: "blob"})); toast(tt("toast.zipDownloaded"));
  } else { lastFiles.forEach((f, i) => setTimeout(() => downloadBlob(f.name, new Blob([f.svg], {type: "image/svg+xml"})), i * 400)); toast(tt("toast.sheetsDownloading")); }
}

// ---------- Démarrage ----------
applyTheme(); applyLang(); buildActions(); buildZoom(); initViewport();
$("#projName").value = state.name;
if (state.tab === "tray") currentSheet = -2;
buildModels(); buildForm(); render();
try { localStorage.removeItem("neoprodfx-texture"); } catch (e) {}
if (hp.get("guide")) setTimeout(openGuide, 1500);
if (hp.get("materiaux")) setTimeout(openMaterials, 1200);
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(() => fit(currentSheet === -1 ? null : $(`#canvas .sheet[data-si="${currentSheet}"]`)), 150); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script>
