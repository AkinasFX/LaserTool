<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaserToolFX</title>
<meta name="description" id="metaDesc" content="Générateur gratuit de boîtes, coffres et formes pour découpe laser : SVG prêts à découper.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LaserToolFX">
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{
  --bg:#eceef2;--panel:#ffffff;--panel2:#f6f7f9;--ink:#14161a;--muted:#6b7280;--line:#e2e5ea;
  --accent:#f97316;--accent2:#ea580c;--accent-ink:#ffffff;--accent-soft:rgba(249,115,22,.12);
  --field:#f4f5f7;--stage:#e4e7ec;--grid:rgba(20,22,26,.055);
  --warn-bg:#fff4e5;--warn:#9a3412;--ok:#15803d;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.10);
  --wood:#f1dfbd;--wood-dark:#b98b5c;
  --glow2:#22d3ee;--panel-rgb:255,255,255;--glass-border:rgba(20,22,26,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1014;--panel:#15181e;--panel2:#1b1f27;--ink:#e9ebef;--muted:#9aa1ad;--line:#262b34;
  --accent:#fb923c;--accent2:#f97316;--accent-ink:#1a0f05;--accent-soft:rgba(251,146,60,.14);
  --field:#0f1116;--stage:#0a0c10;--grid:rgba(255,255,255,.045);
  --warn-bg:#2a1a0c;--warn:#fdba74;--ok:#4ade80;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  --glow2:#38bdf8;--panel-rgb:21,24,30;--glass-border:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{
  --bg:#0e1014;--panel:#15181e;--panel2:#1b1f27;--ink:#e9ebef;--muted:#9aa1ad;--line:#262b34;
  --accent:#fb923c;--accent2:#f97316;--accent-ink:#1a0f05;--accent-soft:rgba(251,146,60,.14);
  --field:#0f1116;--stage:#0a0c10;--grid:rgba(255,255,255,.045);
  --warn-bg:#2a1a0c;--warn:#fdba74;--ok:#4ade80;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  --glow2:#38bdf8;--panel-rgb:21,24,30;--glass-border:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:58px minmax(0,1fr) 32px;height:100vh;overflow:hidden;
  background:
    radial-gradient(900px 480px at 12% -8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(700px 420px at 108% 6%, color-mix(in srgb, var(--glow2) 12%, transparent), transparent 60%),
    var(--bg)}
button{font:inherit;color:inherit}
.ic{flex:none;display:block}

/* ---- Barre d'application ---- */
.appbar{display:flex;align-items:center;gap:14px;padding:0 14px;min-width:0;
  background:color-mix(in srgb, var(--panel) 70%, transparent);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid var(--glass-border);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:32px;height:32px;filter:drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 60%, transparent))}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand b .fx{font-style:normal;color:var(--accent)}
.brand span{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.brand span em{font-style:normal;color:var(--accent);font-weight:700}
.projfield{flex:0 1 300px;min-width:140px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 10px 5px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:text;transition:border-color .15s,box-shadow .15s;margin-left:6px}
.projfield:hover{border-color:var(--accent)}
.projfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.projlbl{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.1}
.projrow{display:flex;align-items:center;gap:6px}
.projname{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:0;outline:none}
.projname::placeholder{color:var(--muted);font-weight:500}
.projfield .pen{color:var(--muted);flex:none}
.projfield:hover .pen,.projfield:focus-within .pen{color:var(--accent)}
.actions{margin-left:auto;display:flex;align-items:center;gap:4px;position:relative}
.tb{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .15s ease,transform .12s ease,box-shadow .2s ease}
.tb:hover{background:var(--panel2)}
.tb.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--accent-ink);padding:8px 14px;margin-left:6px;
  box-shadow:0 1px 1px rgba(0,0,0,.1),0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent),0 8px 22px -8px color-mix(in srgb, var(--accent) 70%, transparent)}
.tb.primary:hover{background:linear-gradient(180deg,var(--accent2),var(--accent2));transform:translateY(-1px);
  box-shadow:0 2px 3px rgba(0,0,0,.12),0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent),0 12px 28px -6px color-mix(in srgb, var(--accent) 80%, transparent)}
.tb.primary:active{transform:translateY(0)}
.tb.dark{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0)) var(--panel2);color:var(--ink);padding:8px 14px;
  border:1px solid var(--glass-border);
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 20px -14px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.03) inset}
.tb.dark:hover{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0)) var(--field);transform:translateY(-1px);
  box-shadow:0 2px 3px rgba(0,0,0,.1),0 14px 26px -12px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.05) inset}
.tb.dark:active{transform:translateY(0)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.menu{position:absolute;right:40px;top:46px;background:color-mix(in srgb, var(--panel) 92%, transparent);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.03) inset;padding:6px;min-width:250px;z-index:30}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--panel2)}
.menu small{display:block;color:var(--muted);font-size:12px;font-weight:400}

/* ---- Espace de travail ---- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 316px;min-height:0}
.panel{background:var(--panel);overflow:auto;min-height:0;scrollbar-width:thin}
.panel.left{border-right:1px solid var(--line)}
.panel.right{border-left:1px solid var(--line)}
.panel-head{padding:14px 14px 6px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.models{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 14px 12px}
.model{flex-direction:row !important;justify-content:flex-start;padding:10px 12px !important;text-align:left !important}
.model{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;cursor:pointer;font-weight:600;font-size:12.5px;text-align:center;transition:border-color .15s,background .15s,box-shadow .2s}
.model:hover{border-color:var(--accent)}
.model[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent),0 0 20px -5px color-mix(in srgb, var(--accent) 60%, transparent)}
.model-desc{margin:-4px 14px 10px;font-size:12px;color:var(--muted)}
details.grp{border-top:1px solid var(--line)}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;user-select:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s;margin-right:3px}
details.grp:not([open])>summary::after{transform:rotate(-45deg)}
details.grp>summary:hover{color:var(--ink)}
.grp-body{padding:0 14px 12px}
.row{display:grid;grid-template-columns:1fr 116px;align-items:center;gap:10px;margin:7px 0}
.row label{font-size:13.5px}
.row .u{position:relative}
.row input[type=number],.row input[type=text],.row select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit;font-size:13.5px}
.row input:focus,.row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 16px -6px color-mix(in srgb, var(--accent) 55%, transparent)}
.row input[type=text]{grid-column:span 1}
.row .u span{position:absolute;right:26px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.sw{justify-self:end;position:relative;width:38px;height:22px;display:inline-block;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:background .15s}
.sw i::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::before{transform:translateX(16px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 2px}
.hint a{color:var(--accent)}
.fontbtns{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:9px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.wide{width:calc(100% - 28px);margin:10px 14px 16px}
.notice ul{margin:0;padding-left:18px;font-size:13px}
.notice li{margin:5px 0}

/* ---- Plan de travail ---- */
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:var(--stage)}
.stagebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.sheettabs{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.zoom{margin-left:auto;display:flex;align-items:center;gap:2px}
.zoom .tb{padding:6px 8px}
.zoom output{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.viewport{position:relative;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.viewport.panning{cursor:grabbing}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-wrap:wrap;gap:48px;align-content:flex-start}
.sheet .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;font-weight:600;margin:0 2px 8px}
.sheet .lbl b{color:var(--ink)}
.sheet .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.sheet>svg{width:100%;height:auto;display:block;border-radius:4px;box-shadow:var(--shadow);background:var(--wood)}
.sheet.decor>svg{background:var(--wood-dark)}
.sheet svg path,.sheet svg circle,.sheet svg rect{vector-effect:non-scaling-stroke}
.sheet svg .cut{stroke-width:1.2px}
.sheet.decor svg .cut{stroke:#ffd1c2}
.sheet svg .engrave-line{stroke-width:1.2px}
.sheet svg [data-ti]{cursor:move}
.plan{cursor:crosshair;touch-action:none;user-select:none}
.plan .p-wall{fill:var(--wood);stroke:#c9a877;stroke-width:1px}
.plan .p-in{fill:#e9d3a9}
.plan .p-grid{stroke:rgba(90,60,20,.25);stroke-width:1px;stroke-dasharray:4 3}
.plan .p-reg{fill:#f5cfa4;stroke:var(--accent);stroke-width:1.4px}
.plan [data-reg]:hover .p-reg{fill:#f3bd85}
.plan text{text-anchor:middle;font-family:Inter,system-ui,sans-serif;pointer-events:none}
.plan .p-name{fill:#3b2a14;font-weight:700}
.plan .p-dim{fill:#7a6040}
.plan .p-split{cursor:pointer}
.plan .p-split circle{fill:var(--panel);stroke:var(--accent);stroke-width:1px}
.plan .p-split text{fill:var(--accent)}
.plan .p-split:hover circle{fill:var(--accent)}.plan .p-split:hover text{fill:var(--accent-ink)}
.plan .p-sel{fill:rgba(249,115,22,.25);stroke:var(--accent);stroke-width:2px;stroke-dasharray:5 3}
.renamer{position:fixed;transform:translate(-50%,-50%);z-index:70;padding:8px 10px;border:2px solid var(--accent);border-radius:9px;background:var(--panel);color:var(--ink);font:600 14px Inter,system-ui,sans-serif;box-shadow:var(--shadow);width:180px}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.sheet svg [data-ti]:hover .grab{fill:rgba(249,115,22,.14);stroke:#f97316;stroke-dasharray:3 2;stroke-width:1px}
.warns{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.warn{pointer-events:auto;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:10px;padding:7px 12px;font-size:13px;box-shadow:var(--shadow);max-width:680px}
.warn.err{font-weight:600}

/* ---- Barre d'état ---- */
.status{display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status .ok{color:var(--ok);font-weight:600}.status .bad{color:var(--warn);font-weight:600}
.status .legend{display:flex;gap:12px;margin-left:auto}
.status .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.status a{color:var(--muted);text-decoration:none}.status a:hover{color:var(--accent)}

/* ---- Fenêtres ---- */
.modal{position:fixed;inset:0;background:rgba(8,10,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.card{background:color-mix(in srgb, var(--panel) 90%, transparent);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--glass-border);border-radius:16px;
  box-shadow:0 1px 1px rgba(0,0,0,.06),0 30px 70px -24px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.03) inset;width:min(560px,100%);max-height:86vh;overflow:auto;padding:20px}
.card h2{margin:0 0 4px;font-size:18px}
.card.wide{width:min(980px,100%)}
.gd{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.gd svg{width:100%;height:auto;display:block}
.gd .gw{fill:#ecd2a2;stroke:#b9955e;stroke-width:1.2}
.gd .gb{fill:#e3c48f;stroke:#b9955e;stroke-width:1.2}
.gd .gbt{fill:#dfc08a;stroke:#b9955e;stroke-width:1.2}
.gd .gac{fill:var(--accent)}
.gd .gdk{fill:#8a5d34;stroke:#5e3d1f}
.gd .gdkline{fill:none;stroke:#8a5d34;stroke-width:6}
.gd .gbx{fill:#f8e6c4;stroke:#c9a46a;stroke-width:1.2}
.gd .gslot{fill:#6e4a28}
.gd .gghost{fill:none;stroke:var(--muted);stroke-dasharray:3 4;opacity:.6}
.gd .gstrip{fill:none;stroke:#ecd2a2;stroke-width:9}
.gd .gmort{fill:none;stroke:#6e4a28;stroke-width:3.5;stroke-dasharray:7 20}
.gd .gpanel{fill:none;stroke:#ecd2a2;stroke-width:9}
.gd .ghinge{fill:none;stroke:#a07a45;stroke-width:9;stroke-dasharray:1.2 4}
.gd .ghg{stroke:#a07a45;stroke-width:1}
.gd .gar2{fill:none;stroke:var(--muted);stroke-width:1.6;color:var(--muted)}
.gd .gc{color:var(--muted)}.gd .gc polyline{fill:none;stroke:var(--muted);stroke-width:1.2}
.gd .gt{font-size:13px;fill:var(--ink);font-weight:600}
.gd .go{font-size:13px;fill:var(--accent);font-weight:700}
.gd .gm{font-size:11.5px;fill:var(--muted)}
.gd .gbk{font-size:11px;fill:#3b2a14;font-weight:600}
.gd-h{font-size:14px;margin:16px 0 6px}
.guidebtn span{font-size:13px}
@media (max-width:1180px){.guidebtn span{display:none}}

.card p{color:var(--muted);margin:4px 0 14px}
.card .close{float:right;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.pitem .meta{flex:1;min-width:0}
.pitem .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .meta small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mtable{width:100%;border-collapse:collapse}
.mtable th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.mtable td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.mtable tr:hover td{background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(20px);background:color-mix(in srgb, var(--ink) 92%, transparent);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:60;box-shadow:0 10px 40px -10px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1180px){.app{grid-template-columns:272px minmax(0,1fr) 284px}.tb.lbl span{display:none}}
@media (max-width:860px){
  body{height:auto;overflow-x:hidden;overflow-y:auto;grid-template-rows:auto auto auto;grid-template-columns:minmax(0,1fr)}
  .appbar{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .actions{flex-wrap:wrap;margin-left:0;width:100%;justify-content:space-between}
  .tb{padding:8px}.tb.primary{margin-left:0}
  .menu{right:0;left:auto}
  .projfield{order:3;flex:1 1 100%;margin-left:0}
  .tb span{display:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .panel{min-width:0}
  .stage{order:-1;height:62vh}
  .panel{overflow:visible;border:0 !important;border-bottom:1px solid var(--line) !important}
  .status{flex-wrap:wrap;white-space:normal;padding:8px 12px}
  .status .legend{margin-left:0}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">

function fieldRow(f, v) {

  else if (typeof def === "boolean") input = `<label class="sw"><input type="checkbox" id="${id}" data-k="${key}"${v[key] ? " checked" : ""}><i></i></label>`;
  else if (o.text) input = `<input type="text" id="${id}" data-k="${key}" value="${esc(v[key])}">`;
  else input = `<div class="u"><input type="number" id="${id}" data-k="${key}" value="${v[key]}" step="${o.step || 1}"${o.min !== undefined ? ` min="${o.min}"` : ""}${o.max !== undefined ? ` max="${o.max}"` : ""}>${unit ? `<span>${unit}</span>` : ""}</div>`;

  const td = trayData(), L = td.layers[td.cur], t = v.t, px = +svg.dataset.px, py = +svg.dataset.py;
  const gx = Math.max(1, Math.round(v.gridX)), gy = Math.max(1, Math.round(v.gridY));
  const clamp = (a, lo, hi) => Math.max(lo, Math.min(hi, a));
  const cellAt = e => { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return [clamp(Math.floor((p.x - t) / px), 0, gx - 1), clamp(Math.floor((p.y - t) / py), 0, gy - 1)]; };
  const sel = svg.querySelector("#planSel");
  const show = (a, b) => { const c0 = Math.min(a[0], b[0]), c1 = Math.max(a[0], b[0]), r0 = Math.min(a[1], b[1]), r1 = Math.max(a[1], b[1]); sel.setAttribute("x", t + c0 * px); sel.setAttribute("y", t + r0 * py); sel.setAttribute("width", (c1 - c0 + 1) * px); sel.setAttribute("height", (r1 - r0 + 1) * py); sel.setAttribute("visibility", "visible"); };
  const commit = () => { save(); render(); };
  svg.addEventListener("pointerdown", e => {
    if (e.target.closest("[data-split]") || e.button !== 0) return;
    e.preventDefault(); e.stopPropagation(); svg.setPointerCapture(e.pointerId);
    const a = cellAt(e); let b = a;
    const move = ev => { b = cellAt(ev); if (b[0] !== a[0] || b[1] !== a[1]) show(a, b); };
    const up = () => {
      svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up); sel.setAttribute("visibility", "hidden");
      if (b[0] === a[0] && b[1] === a[1]) { // simple clic / toucher : renommer la case
        const k = L.regions.findIndex(r => a[0] >= r[0] && a[0] <= r[2] && a[1] >= r[1] && a[1] <= r[3]);
        if (k >= 0) rename(svg.querySelector(`[data-reg="${k}"]`));
        return;
      }
      // fusion : on agrandit la sélection jusqu'à englober entièrement les cases touchées

      while (grown) { grown = false; for (const r of L.regions) if (r[0] <= R[2] && r[2] >= R[0] && r[1] <= R[3] && r[3] >= R[1]) { const N = [Math.min(R[0], r[0]), Math.min(R[1], r[1]), Math.max(R[2], r[2]), Math.max(R[3], r[3])]; if (N.some((x, i) => x !== R[i])) { R = N; grown = true; } } }
      const inside = L.regions.filter(r => r[0] >= R[0] && r[2] <= R[2] && r[1] >= R[1] && r[3] <= R[3]);
      const name = (inside.find(r => r[4]) || [])[4] || "";

    };
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerup", up);
  });
  svg.querySelectorAll("[data-split]").forEach(s => {
    s.addEventListener("pointerdown", e => e.stopPropagation());
    s.addEventListener("click", e => { e.stopPropagation(); const r = L.regions[+s.dataset.split]; L.regions.splice(+s.dataset.split, 1); L.regions.push([r[0], r[1], r[0], r[1], r[4]]); commit(); });
  });
  function rename(g) {
    if (!g) return;
    const r = L.regions[+g.dataset.reg], box = g.querySelector("rect").getBoundingClientRect();
    const inp = document.createElement("input"); inp.className = "renamer"; inp.value = r[4]; inp.placeholder = tt("sheet.cellRename");
    Object.assign(inp.style, {left: box.left + box.width / 2 + "px", top: box.top + box.height / 2 + "px"});
    document.body.appendChild(inp); inp.focus(); inp.select();
    let done = false; const fin = ok => { if (done) return; done = true; if (ok) { r[4] = inp.value.trim(); commit(); } inp.remove(); };
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") fin(true); if (ev.key === "Escape") fin(false); });
    inp.addEventListener("blur", () => fin(true));

}
const GEN = {box: genBox, shape: genShape, chest: genChest, orga: genOrga, tray: genTray};

// ---------- Placement ----------
function layout(pieces, bw, bh) {
  const M = 2, G = 2.5, sheets = [[]];
  let x = M, y = M, rowH = 0;
  const items = pieces.map(p => {
    let rot = false, w = p.w, h = p.h;
    if (w > bw - 2 * M || (h > bh - 2 * M && h <= bw - 2 * M && w <= bh - 2 * M)) { if (h <= bw - 2 * M && w <= bh - 2 * M) { rot = true; [w, h] = [h, w]; } }
    if (w > bw - 2 * M || h > bh - 2 * M) throw new Error(tt("err.layout.pieceTooBig", {name: p.name, w: f1(p.w), h: f1(p.h), bw, bh}));
    return {p, w, h, rot};
  }).sort((a, b) => b.h - a.h);
  for (const it of items) {
    if (x + it.w > bw - M + 1e-6) { x = M; y += rowH + G; rowH = 0; }
    if (y + it.h > bh - M + 1e-6) { sheets.push([]); x = M; y = M; rowH = 0; }
    sheets[sheets.length - 1].push({...it, x, y});
    x += it.w + G; rowH = Math.max(rowH, it.h);
  }
  return sheets;
}

// ---------- Texte -> tracés ----------
const fontCache = {};
async function getFont(name) {
  if (!window.opentype) return null;
  if (!(name in fontCache)) fontCache[name] = fetch("https://cdn.jsdelivr.net/npm/@fontsource/" + FONTS[name]).then(r => r.arrayBuffer()).then(b => opentype.parse(b)).catch(() => null);
  return fontCache[name];
}
// Taille = hauteur des majuscules visée ; en aperçu, groupe déplaçable avec zone de prise
function textSvg(el, font, fam, preview) {
  let inner, box;
  if (font) {
    let size = el.size / Math.max(0.4, (font.tables.os2 && font.tables.os2.sCapHeight || font.unitsPerEm * 0.7) / font.unitsPerEm), cap = el.size;
    let w = font.getAdvanceWidth(el.str, size);
    if (el.maxW && w > el.maxW) { const k = el.maxW / w; size *= k; cap *= k; w = el.maxW; } // étiquette trop longue : on réduit
    const path = font.getPath(el.str, el.x - w / 2, el.y + cap / 2, size);
    inner = `<path class="engrave" d="${path.toPathData(3)}" fill="#000000" stroke="none"/>`;
    const bb = path.getBoundingBox(); box = [bb.x1, bb.y1, bb.x2 - bb.x1, bb.y2 - bb.y1];
  } else {
    const size = el.size * 1.4, w = 0.55 * size * el.str.length;
    inner = `<text x="${f3(el.x)}" y="${f3(el.y)}" font-size="${f3(size)}" text-anchor="middle" dominant-baseline="middle" font-family="${esc(fam)}, cursive" fill="#000000">${esc(el.str)}</text>`;
    box = [el.x - w / 2, el.y - size / 2, w, size];
  }
  if (!preview || !el.id) return inner;
  return `<g data-ti="${el.id}"><rect class="grab" x="${f3(box[0] - 1)}" y="${f3(box[1] - 1)}" width="${f3(box[2] + 2)}" height="${f3(box[3] + 2)}" fill="transparent"/>${inner}</g>`;
}

// Glisser = déplacer (aimanté au centre horizontal), molette = taille
function bindTextDrag(g, v) {
  const id = g.dataset.ti, cur = () => (state.values[state.tab] = state.values[state.tab] || {});
  g.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation(); g.setPointerCapture(e.pointerId);
    const inv = g.parentNode.getScreenCTM().inverse(), p0 = new DOMPoint(e.clientX, e.clientY).matrixTransform(inv);
    const tx0 = v["tx" + id] || 0, ty0 = v["ty" + id] || 0; let dx = 0, dy = 0;
    const move = ev => {
      const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(inv); dx = p.x - p0.x; dy = p.y - p0.y;
      if (Math.abs(tx0 + dx) < 1.5) dx = -tx0;
      g.setAttribute("transform", `translate(${f3(dx)},${f3(dy)})`);
    };
    const up = () => {
      g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up);
      if (Math.abs(dx) + Math.abs(dy) > 0.05) { const c = cur(); c["tx" + id] = tx0 + dx; c["ty" + id] = ty0 + dy; save(); render(); }
    };
    g.addEventListener("pointermove", move); g.addEventListener("pointerup", up);
  });
  g.addEventListener("wheel", e => {
    e.preventDefault(); e.stopPropagation();
    const key = id === "2" && v.texte && v.texte2 ? "taille2" : "taille", c = cur();
    c[key] = Math.max(2, Math.round((v[key] * (e.deltaY < 0 ? 1.08 : 1 / 1.08)) * 2) / 2); v[key] = c[key];
    save(); const f = $("#f_" + key); if (f) f.value = c[key]; schedule();
  }, {passive: false});
}

// ---------- Rendu ----------
function sheetSvg(sheet, bw, bh, v, font, idx, total, preview) {
  let body = "";
  for (const it of sheet) {
    const tf = it.rot ? `translate(${f3(it.x + it.h)},${f3(it.y)}) rotate(90)` : `translate(${f3(it.x)},${f3(it.y)})`;
    let g = "";
    for (const el of it.p.els) {
      if (el.k === "cut") g += `<path class="cut" d="${el.d}" fill="none" stroke="#ff0000" stroke-width="0.1"/>`;
      else if (el.k === "line") g += `<path class="engrave-line" d="${el.d}" fill="none" stroke="#000000" stroke-width="0.3"/>`;
      else if (el.k === "text") g += textSvg(el, font, v.police, preview);
    }
    if (v.reperes) g += `<text x="${f3(it.p.w / 2)}" y="${f3(Math.min(it.p.h - 2, it.p.h * 0.18 + 3))}" font-size="3.2" text-anchor="middle" fill="#0000ff" font-family="Arial">${esc(it.p.name)}</text>`;
    body += `<g transform="${tf}">${g}</g>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${bw}mm" height="${bh}mm" viewBox="0 0 ${bw} ${bh}">\n<!-- ${tt("export.svgComment", {name: esc(state.name), idx, total})} -->\n${body}\n</svg>`;
}
const PX = 3; // pixels par mm à 100 %
let timer = null, lastFiles = [], lastInfo = [], needFit = true, currentSheet = 0;
const view = {z: 1, x: 0, y: 0};
function schedule() { clearTimeout(timer); timer = setTimeout(render, 110); }
function applyView() { $("#canvas").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`; $("#zoomPct").textContent = Math.round(view.z * 100) + "%"; }
function fit(el) {
  const vp = $("#viewport").getBoundingClientRect(), c = $("#canvas");
  let bx = 0, by = 0, w = c.offsetWidth, h = c.offsetHeight;
  if (el) { bx = el.offsetLeft; by = el.offsetTop; w = el.offsetWidth; h = el.offsetHeight; }
  if (!w || !h || !vp.width) return;
  const pad = 36; view.z = Math.max(0.05, Math.min((vp.width - 2 * pad) / w, (vp.height - 2 * pad) / h, 4));
  view.x = (vp.width - w * view.z) / 2 - bx * view.z; view.y = (vp.height - h * view.z) / 2 - by * view.z; applyView();
}
function zoomAt(f, cx, cy) { const nz = Math.min(8, Math.max(0.05, view.z * f)); view.x = cx - (cx - view.x) * nz / view.z; view.y = cy - (cy - view.y) * nz / view.z; view.z = nz; applyView(); }
function markTabs() { document.querySelectorAll("#sheetTabs [data-si]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.si === currentSheet))); const xi = $("#xSheetInfo"); if (xi) xi.textContent = lastFiles[Math.max(0, currentSheet)] ? lastFiles[Math.max(0, currentSheet)].name : ""; }
function initViewport() {
  const vp = $("#viewport");
  vp.addEventListener("wheel", e => { e.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
  // Un doigt / souris = déplacer ; deux doigts = pincer pour zoomer (tablette, téléphone)
  const pts = new Map(); let pan = null, pinch = null;
  const two = () => { const [a, b] = [...pts.values()]; return {d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}; };
  vp.addEventListener("pointerdown", e => {
    if (e.target.closest("[data-ti],button,.plan")) return;
    vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 2) { pinch = two(); pan = null; }
    else if (pts.size === 1) { pan = {x0: e.clientX - view.x, y0: e.clientY - view.y}; vp.classList.add("panning"); }
  });
  vp.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pinch && pts.size >= 2) {
      const p = two(), r = vp.getBoundingClientRect();
      view.x += p.x - pinch.x; view.y += p.y - pinch.y; applyView();
      zoomAt(p.d / pinch.d, p.x - r.left, p.y - r.top); pinch = p;
    } else if (pan) { view.x = e.clientX - pan.x0; view.y = e.clientY - pan.y0; applyView(); }
  });

    if (pts.size === 1) { const q = [...pts.values()][0]; pan = {x0: q.x - view.x, y0: q.y - view.y}; }
    if (!pts.size) { pan = null; vp.classList.remove("panning"); }
  };

}
async function render() {
  const v = vals(); const [bw, bh] = bedOf(v);

  try {
    res = GEN[state.tab](v);
    // les pièces de décor vont sur leurs propres planches (autre bois)
    const main = layout(res.pieces.filter(p => !p.decor), bw, bh), dec = res.pieces.some(p => p.decor) ? layout(res.pieces.filter(p => p.decor), bw, bh) : [];
    dec.forEach(s => s.decor = true);
    sheets = [...main, ...dec];
  } catch (e) {
    $("#warns").innerHTML = `<div class="warn err">⚠️ ${esc(e.message)}</div>`;
    $("#status").innerHTML = `<span class="bad">${tt("status.toFix", {msg: esc(e.message)})}</span>`;
    return;
  }
  const needsText = res.pieces.some(p => p.els.some(e => e.k === "text"));
  const font = needsText ? await getFont(v.police) : null;
  const warns = [...res.warns];
  if (needsText && !font) warns.push(String(v.police).startsWith("local:") ? tt("warn.fontLocal") : tt("warn.fontMissing"));
  $("#warns").innerHTML = warns.map(w => `<div class="warn">⚠️ ${esc(w)}</div>`).join("");
  const base = slug(state.name) + "_" + ({box: `boite_${v.L}x${v.W}x${v.H}`, shape: `${v.forme}_${v.W}x${v.H}`, chest: `coffre_${v.L}x${v.W}x${v.H}`}[state.tab]);
  lastFiles = sheets.map((s, i) => ({name: sheets.length > 1 ? `${base}_planche${i + 1}${s.decor ? "_decor" : ""}.svg` : `${base}.svg`, svg: sheetSvg(s, bw, bh, v, font, i + 1, sheets.length, false)}));
  lastInfo = res.info;
  const cols = Math.min(2, sheets.length), c = $("#canvas");
  c.style.width = (cols * bw * PX + (cols - 1) * 48) + "px";
  const isTray = state.tab === "tray", td = isTray ? trayData() : null;
  const plan = isTray ? `<div class="sheet plan-card" data-si="-2" style="width:${bw * PX}px"><div class="lbl"><span><b>${tt("sheet.topView")}</b> · ${tt("sheet.layerOf", {cur: td.cur + 1, total: td.layers.length})}</span><span>${tt("sheet.planHelp")}</span></div>${planSvg(v)}</div>` : "";
  c.innerHTML = plan + sheets.map((s, i) => `<div class="sheet${s.decor ? " decor" : ""}" data-si="${i}" style="width:${bw * PX}px"><div class="lbl"><span><b>${tt("sheet.card", {n: i + 1})}</b> · ${tt("sheet.pieceCount", {n: s.length, s: s.length > 1 ? "s" : ""})}${s.decor ? `<span class="tag">${tt("sheet.decorTag")}</span>` : ""}</span><button class="mini" data-dl="${i}">${icon("download", 14)}${tt("sheet.svgBtn")}</button></div>${sheetSvg(s, bw, bh, v, font, i + 1, sheets.length, true)}</div>`).join("");
  c.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => downloadBlob(lastFiles[+b.dataset.dl].name, new Blob([lastFiles[+b.dataset.dl].svg], {type: "image/svg+xml"})));
  c.querySelectorAll("[data-ti]").forEach(g => bindTextDrag(g, v));
  if (isTray) bindPlan(c.querySelector("svg.plan"), v);
  if (currentSheet >= sheets.length || (currentSheet === -2 && !isTray)) currentSheet = 0;
  $("#sheetTabs").innerHTML = (isTray ? `<button class="chip" data-si="-2" aria-pressed="${currentSheet === -2}">${tt("sheet.plan")}</button>` : "") + `<button class="chip" data-si="-1" aria-pressed="${currentSheet === -1}">${tt("sheet.all")}</button>` + sheets.map((s, i) => `<button class="chip" data-si="${i}" aria-pressed="${i === currentSheet}">${s.decor ? "🎨 " : ""}${tt("sheet.n", {n: i + 1})}</button>`).join("");
  $("#sheetTabs").querySelectorAll("[data-si]").forEach(b => b.onclick = () => { currentSheet = +b.dataset.si; markTabs(); fit(currentSheet === -1 ? null : c.querySelector(`.sheet[data-si="${currentSheet}"]`)); });

  $("#status").innerHTML = `<span>${tt("status.pieces", {n: res.pieces.length})}</span><span>${tt("status.sheets", {n: sheets.length, s: sheets.length > 1 ? "s" : "", bw, bh})}</span><span>${tt("status.woodUsed", {pct})}</span>${warns.length ? `<span class="bad">${tt("status.alerts", {n: warns.length, s: warns.length > 1 ? "s" : ""})}</span>` : `<span class="ok">${tt("status.ready")}</span>`}
    <span class="legend"><span><i style="background:#ff0000"></i>${tt("status.legend.cut")}</span><span><i style="background:#000;outline:1px solid var(--line)"></i>${tt("status.legend.engrave")}</span><span><i style="background:#0000ff"></i>${tt("status.legend.marks")}</span><a href="https://www.youtube.com/@NeoProdFX" target="_blank" rel="noopener">${tt("status.offeredBy")}</a></span>`;
  $("#info").innerHTML = `<ul>${res.info.map(i => `<li>${esc(i)}</li>`).join("")}<li>${tt("info.kerfTip", {t: f1(v.t), k: f1(v.kerf)})}</li></ul><button class="btn ghost sm" id="openGuide" style="margin-top:8px">${icon("book", 15)}${tt("info.viewGuide")}</button>`;
  $("#openGuide").onclick = openGuide;
  if (needFit) { needFit = false; requestAnimationFrame(() => fit(currentSheet === -1 ? null : c.querySelector(`.sheet[data-si="${currentSheet}"]`))); }
}

// ---------- Export ----------
function downloadBlob(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
async function doExport(kind) {
  if (!lastFiles.length) { toast(tt("toast.nothingToExport")); return; }
  const pj = new Blob([JSON.stringify(projectData(), null, 2)], {type: "application/json"}), s = slug(state.name);
  if (kind === "json") return downloadBlob(`${s}.lasertoolfx.json`, pj);
  if (kind === "sheet") { const f = lastFiles[Math.max(0, currentSheet)]; return downloadBlob(f.name, new Blob([f.svg], {type: "image/svg+xml"})); }
  const notice = tt("export.notice", {name: state.name, steps: lastInfo.join("\n- ")});
  if (window.JSZip) {
    const zip = new JSZip(), dir = zip.folder(s);
    lastFiles.forEach(f => dir.file(f.name, f.svg)); dir.file(`${s}.lasertoolfx.json`, pj); dir.file("NOTICE.txt", notice);
    downloadBlob(`${s}.zip`, await zip.generateAsync({type: "blob"})); toast(tt("toast.zipDownloaded"));
  } else { lastFiles.forEach((f, i) => setTimeout(() => downloadBlob(f.name, new Blob([f.svg], {type: "image/svg+xml"})), i * 400)); toast(tt("toast.sheetsDownloading")); }
}

// ---------- Démarrage ----------
applyTheme(); applyLang(); buildActions(); buildZoom(); initViewport();
$("#projName").value = state.name;
if (state.tab === "tray") currentSheet = -2;
buildModels(); buildForm(); render();
if (hp.get("guide")) setTimeout(openGuide, 1500);
if (hp.get("materiaux")) setTimeout(openMaterials, 1200);
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(() => fit(currentSheet === -1 ? null : $(`#canvas .sheet[data-si="${currentSheet}"]`)), 150); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
